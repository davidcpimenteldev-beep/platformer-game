  let hoveredUpgrade = -1;
  let bananaHovered = false;
  let bananaScale = 1;
  let targetBananaScale = 1;

  // pixelation canvas (low-res for that pixel-3D look)
  let pixCanvas = null;
  let pixCtx = null;
  const PIX_W = 180;
  const PIX_H = 240;

  // cheat code state
  let cheatBuffer = '';
  const CHEAT_CODE = 'badapple';
  let usedCheat = false;

  // tropical music
  let tropicalPlaying = false;
  let tropicalNodes = [];
  let tropicalTimer = null;
  let tropicalGain = null; // master gain node for instant mute on exit

  function init() {
    if (!pixCanvas) {
      pixCanvas = document.createElement('canvas');
      pixCanvas.width = PIX_W;
      pixCanvas.height = PIX_H;
      pixCtx = pixCanvas.getContext('2d');
    }
  }

  function getCost(upg) {
    return Math.floor(upg.baseCost * Math.pow(upg.costMult, upg.count));
  }

  function formatNum(n) {
    if (n >= 1e12) return (n / 1e12).toFixed(1) + 'T';
    if (n >= 1e9) return (n / 1e9).toFixed(1) + 'B';
    if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
    if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
    return Math.floor(n).toString();
  }

  // Realistic 3D banana — proper anatomy:
  //  - Gentle arc (not a crescent), ~25° total bend
  //  - Pentagonal cross-section (5 ridges/facets)
  //  - Fat middle tapering to narrow tips
  //  - Stem stub on top, dark blossom nub on bottom
  //  - Spins upright around Y axis
  function drawBanana3D(angle) {
    const c = pixCtx;
    c.clearRect(0, 0, PIX_W, PIX_H);
    const cx = PIX_W / 2;
    const cy = PIX_H / 2 + 8;
    const cosA = Math.cos(angle);
    const sinA = Math.sin(angle);

    // spine: gentle arc in XZ plane, Y is up
    const N = 48;
    const LEN = 90;
    const FAT = 17; // max radius at fattest point

    // build spine with gentle curve
    const pts = [];
    for (let i = 0; i <= N; i++) {
      const t = i / N; // 0=stem(top) 1=blossom(bottom)
      // Y: top to bottom
      const y3d = -LEN/2 + t * LEN;
      // gentle arc: peaks in middle, like a real banana
      const bendAmt = Math.sin(t * Math.PI) * 18;
      const x3d = bendAmt;
      const z3d = Math.sin(t * Math.PI) * 5;

      // radius: 0 at ends, fat in middle (slightly biased toward stem end)
      const taper = Math.sin(Math.pow(t, 0.85) * Math.PI);
      const r = taper * FAT;

      // rotate around Y
      const rx = x3d * cosA - z3d * sinA;
      const rz = x3d * sinA + z3d * cosA;
      pts.push({ x: rx, y: y3d, z: rz, r, t });
    }

    c.save();
    c.translate(cx, cy);

    // ground shadow
    c.fillStyle = '#00000018';
    c.beginPath();
    c.ellipse(pts[N].x * 0.2, LEN/2 + 14, 30, 7, 0, 0, Math.PI * 2);
    c.fill();

    // light direction (fixed, from upper-right-front)
    const lightX = 0.4, lightY = -0.5, lightZ = 0.7;
    const lightLen = Math.sqrt(lightX*lightX + lightY*lightY + lightZ*lightZ);

    // draw banana using 5-facet pentagonal cross sections
    // for each slice, draw 5 quads connecting to next slice
    const FACETS = 5;

    // precompute all vertex positions
    const verts = []; // [slice][facet] = {x,y,z, sx,sy}
    for (let i = 0; i <= N; i++) {
      const row = [];
      const p = pts[i];
      for (let f = 0; f < FACETS; f++) {
        const fAngle = (f / FACETS) * Math.PI * 2 + 0.3; // offset so a flat face is toward camera
        // local cross-section position
        const lx = Math.cos(fAngle) * p.r;
        const lz = Math.sin(fAngle) * p.r * 0.85; // slightly oval cross-section
        // rotate by banana's Y rotation
        const wx = p.x + lx * cosA - lz * sinA;
        const wz = p.z + lx * sinA + lz * cosA;
        // project to 2D (simple orthographic)
        row.push({ x: wx, y: p.y, z: wz, sx: wx, sy: p.y });
      }
      verts.push(row);
    }

    // collect all facet quads, sort by average Z
    const quads = [];
    for (let i = 0; i < N; i++) {
      for (let f = 0; f < FACETS; f++) {
        const f2 = (f + 1) % FACETS;
        const v0 = verts[i][f], v1 = verts[i][f2];
        const v2 = verts[i+1][f2], v3 = verts[i+1][f];
        const avgZ = (v0.z + v1.z + v2.z + v3.z) / 4;
        // face normal (approximate) for lighting
        const ex = v1.sx - v0.sx, ey = v1.sy - v0.sy;
        const fx = v3.sx - v0.sx, fy = v3.sy - v0.sy;
        const nz = ex * fy - ey * fx; // 2D cross product gives Z component
        // approximate 3D normal from facet angle
        const fMid = (f + 0.5) / FACETS * Math.PI * 2 + 0.3;
        const nx = Math.cos(fMid) * cosA - Math.sin(fMid) * sinA * 0.85;
        const ny2 = 0;
        const nzr = Math.cos(fMid) * sinA + Math.sin(fMid) * cosA * 0.85;
        const nl = Math.sqrt(nx*nx + nzr*nzr) || 1;
        const dot = (nx/nl * lightX + nzr/nl * lightZ) / lightLen;
        quads.push({ v: [v0,v1,v2,v3], avgZ, dot, t: pts[i].t, r: pts[i].r, facet: f });
      }
    }
    quads.sort((a, b) => a.avgZ - b.avgZ);

    // draw quads back to front — stroke with same color to eliminate anti-aliasing seams
    for (const q of quads) {
      if (q.r < 0.3) continue; // lower threshold so tapered ends stay connected
      const light = 0.35 + Math.max(0, q.dot) * 0.65;

      // base color: yellow with slight green near stem, brown tinge near tip
      let bR = 255, bG = 210, bB = 20;
      if (q.t < 0.15) { bG += 20; bB += 15; } // greenish near stem
      if (q.t > 0.85) { bR -= 20; bG -= 30; } // brownish at blossom end

      const r = Math.floor(bR * light);
      const g = Math.floor(bG * light);
      const b = Math.floor(bB * light);

      const col = `rgb(${r},${g},${b})`;
      c.fillStyle = col;
      c.strokeStyle = col; // same color stroke eliminates seam gaps
      c.lineWidth = 1;
      c.lineJoin = 'round';
      c.beginPath();
      c.moveTo(q.v[0].sx, q.v[0].sy);
      c.lineTo(q.v[1].sx, q.v[1].sy);
      c.lineTo(q.v[2].sx, q.v[2].sy);
      c.lineTo(q.v[3].sx, q.v[3].sy);
      c.closePath();
      c.fill();
      c.stroke(); // fill seam gaps between adjacent quads

      // subtle edge lines between facets (the 5 ridges)
      if (q.r > 3) {
        c.strokeStyle = `rgba(${Math.floor(r*0.7)},${Math.floor(g*0.7)},${Math.floor(b*0.5)},0.2)`;
        c.lineWidth = 0.6;
        c.beginPath();
        c.moveTo(q.v[0].sx, q.v[0].sy);
        c.lineTo(q.v[3].sx, q.v[3].sy);
        c.stroke();
      }

      // specular highlight on bright facets
      if (light > 0.75 && q.r > 5) {
        c.fillStyle = `rgba(255,255,230,${(light - 0.75) * 0.5})`;
        const mx = (q.v[0].sx + q.v[1].sx + q.v[2].sx + q.v[3].sx) / 4;
        const my = (q.v[0].sy + q.v[1].sy + q.v[2].sy + q.v[3].sy) / 4;
        c.beginPath();
        c.ellipse(mx, my, q.r * 0.25, 2, 0, 0, Math.PI * 2);
        c.fill();
      }

      // brown spots (very sparse)
      if (q.t > 0.3 && q.t < 0.8 && q.facet === 2 && Math.floor(q.t * N) % 7 === 0) {
        c.fillStyle = '#7a5a1122';
        const mx = (q.v[0].sx + q.v[2].sx) / 2;
        const my = (q.v[0].sy + q.v[2].sy) / 2;
        c.beginPath(); c.arc(mx, my, 1.5 + (Math.floor(q.t*10) % 2), 0, Math.PI * 2); c.fill();
      }
    }

    // Find first and last slices with visible body radius for seamless stem/blossom connection
    let firstVisIdx = 0, lastVisIdx = N;
    for (let i = 0; i <= N; i++) { if (pts[i].r >= 1.5) { firstVisIdx = i; break; } }
    for (let i = N; i >= 0; i--) { if (pts[i].r >= 1.5) { lastVisIdx = i; break; } }

    // stem (top end) — connects into the body surface
    const stemConn = pts[firstVisIdx]; // where body actually starts
    const stemTop = pts[0];
    const stemR = Math.max(stemConn.r * 0.4, 3);
    const stemH = 16;
    // draw stem from body connection point upward
    c.fillStyle = '#5a4030';
    c.beginPath();
    c.moveTo(stemConn.x - stemR, stemConn.y);
    c.lineTo(stemTop.x - stemR * 0.4, stemTop.y - stemH);
    c.lineTo(stemTop.x + stemR * 0.4, stemTop.y - stemH);
    c.lineTo(stemConn.x + stemR, stemConn.y);
    c.closePath(); c.fill();
    // stem outline for connection
    c.strokeStyle = '#5a4030';
    c.lineWidth = 1;
    c.stroke();
    // stem cut surface
    c.fillStyle = '#4a3525';
    c.beginPath();
    c.ellipse(stemTop.x, stemTop.y - stemH, stemR * 0.5, 2.5, 0, 0, Math.PI * 2);
    c.fill();
    // stem texture lines
    c.strokeStyle = '#3e2a1a44';
    c.lineWidth = 0.7;
    c.beginPath(); c.moveTo(stemTop.x - 1, stemConn.y); c.lineTo(stemTop.x - 1, stemTop.y - stemH + 2); c.stroke();
    c.beginPath(); c.moveTo(stemTop.x + 2, stemConn.y); c.lineTo(stemTop.x + 2, stemTop.y - stemH + 3); c.stroke();

    // cap the top of the banana body so no gap shows between stem and body
    if (firstVisIdx < N) {
      const capSlice = verts[firstVisIdx];
      const capLight = 0.55;
      const cr = Math.floor(240 * capLight), cg = Math.floor(200 * capLight), cb = Math.floor(20 * capLight);
      c.fillStyle = `rgb(${cr},${cg},${cb})`;
      c.strokeStyle = c.fillStyle;
      c.lineWidth = 1;
      c.beginPath();
      c.moveTo(capSlice[0].sx, capSlice[0].sy);
      for (let f = 1; f < FACETS; f++) c.lineTo(capSlice[f].sx, capSlice[f].sy);
      c.closePath(); c.fill(); c.stroke();
    }

    // blossom end (bottom) — connects from body surface
    const blosConn = pts[lastVisIdx];
    const blosEnd = pts[N];
    c.fillStyle = '#3e2a1a';
    c.beginPath();
    c.moveTo(blosConn.x - 3, blosConn.y);
    c.quadraticCurveTo(blosEnd.x, blosEnd.y + 10, blosConn.x + 3, blosConn.y);
    c.closePath(); c.fill();
    // stroke to seal connection
    c.strokeStyle = '#3e2a1a';
    c.lineWidth = 1;
    c.stroke();
    c.fillStyle = '#2a1a0f';
    c.beginPath(); c.arc(blosEnd.x, blosEnd.y + 8, 2, 0, Math.PI * 2); c.fill();

    c.restore();
  }

  // draw beach background
  // pre-rendered static beach (cached to offscreen canvas)
  let beachCache = null;
  function getBeachCache(w, h) {
    if (beachCache && beachCache.width === w && beachCache.height === h) return beachCache;
    beachCache = document.createElement('canvas');
    beachCache.width = w; beachCache.height = h;
    const c = beachCache.getContext('2d');
    renderStaticBeach(c, w, h);
    return beachCache;
  }

  function renderStaticBeach(c, w, h) {
    // sky — warm sunset gradient
    const sky = c.createLinearGradient(0, 0, 0, h * 0.52);
    sky.addColorStop(0, '#5b9fd4');
    sky.addColorStop(0.35, '#7ec8e3');
    sky.addColorStop(0.6, '#b5dff5');
    sky.addColorStop(0.85, '#fde8c9');
    sky.addColorStop(1, '#f7c59f');
    c.fillStyle = sky; c.fillRect(0, 0, w, h * 0.55);

    // sun with soft glow
    const sunX = w * 0.78, sunY = h * 0.18;
    const sunGlow = c.createRadialGradient(sunX, sunY, 5, sunX, sunY, 80);
    sunGlow.addColorStop(0, '#ffffff');
    sunGlow.addColorStop(0.15, '#fff9e6');
    sunGlow.addColorStop(0.4, '#ffd70033');
    sunGlow.addColorStop(1, '#ffd70000');
    c.fillStyle = sunGlow; c.fillRect(sunX - 80, sunY - 80, 160, 160);
    // sun disc
    c.fillStyle = '#fff4dc';
    c.beginPath(); c.arc(sunX, sunY, 22, 0, Math.PI * 2); c.fill();

    // wispy clouds (static)
    c.fillStyle = '#ffffff55';
    const cloudShapes = [[120,35,70,14],[300,55,55,11],[500,25,80,16],[650,60,45,10],[180,75,50,12]];
    for (const [cx,cy,rx,ry] of cloudShapes) {
      c.beginPath(); c.ellipse(cx % w, cy, rx, ry, 0, 0, Math.PI * 2); c.fill();
      c.beginPath(); c.ellipse((cx + rx * 0.5) % w, cy - ry * 0.3, rx * 0.6, ry * 0.8, 0, 0, Math.PI * 2); c.fill();
    }

    // distant ocean
    const ocean = c.createLinearGradient(0, h * 0.48, 0, h * 0.68);
    ocean.addColorStop(0, '#2980b9');
    ocean.addColorStop(0.3, '#1a6fa0');
    ocean.addColorStop(0.6, '#1b7aad');
    ocean.addColorStop(1, '#48a9c5');
    c.fillStyle = ocean; c.fillRect(0, h * 0.5, w, h * 0.2);

    // horizon shimmer line
    c.fillStyle = '#ffffff22';
    c.fillRect(0, h * 0.5, w, 2);

    // gentle static wave foam lines
    c.strokeStyle = '#ffffff18'; c.lineWidth = 1.5;
    for (let wv = 0; wv < 5; wv++) {
      c.beginPath();
      for (let x = 0; x < w; x += 3) {
        const y = h * 0.53 + wv * 12 + Math.sin(x * 0.015 + wv * 2.1) * 3 + Math.sin(x * 0.04 + wv) * 1.5;
        if (x === 0) c.moveTo(x, y); else c.lineTo(x, y);
      }
      c.stroke();
    }

    // wet sand (dark)
    const wetSand = c.createLinearGradient(0, h * 0.67, 0, h * 0.74);
    wetSand.addColorStop(0, '#c4a45a');
    wetSand.addColorStop(1, '#d4b06a');
    c.fillStyle = wetSand; c.fillRect(0, h * 0.67, w, h * 0.07);
    // water edge foam
    c.fillStyle = '#e8dcc833';
    for (let x = 0; x < w; x += 4) {
      const fy = h * 0.68 + Math.sin(x * 0.03) * 3;
      c.fillRect(x, fy, 3, 2);
    }

    // dry sand
    const sand = c.createLinearGradient(0, h * 0.73, 0, h);
    sand.addColorStop(0, '#e8cc7a');
    sand.addColorStop(0.4, '#f0d68a');
    sand.addColorStop(1, '#dab85e');
    c.fillStyle = sand; c.fillRect(0, h * 0.73, w, h * 0.27);

    // sand grain texture (deterministic)
    for (let i = 0; i < 200; i++) {
      const sx = ((i * 97 + 31) % (w - 4)) + 2;
      const sy = h * 0.74 + ((i * 53 + 17) % (h * 0.24));
      const shade = ((i * 7) % 3 === 0) ? '#c6901522' : '#f5e0a811';
      c.fillStyle = shade;
      c.fillRect(sx, sy, 1 + (i % 2), 1);
    }

    // small shells on sand
    c.fillStyle = '#f5f0e0';
    const shells = [[150, h*0.82], [380, h*0.88], [520, h*0.79], [700, h*0.85]];
    for (const [sx, sy] of shells) {
      c.beginPath(); c.arc(sx % w, sy, 3, 0, Math.PI); c.fill();
      c.strokeStyle = '#c8b888'; c.lineWidth = 0.5;
      c.beginPath(); c.arc(sx % w, sy, 3, 0, Math.PI); c.stroke();
    }

    // palm tree — naturalistic trunk with segments
    const palmX = 55, palmTopY = h * 0.32;
    // trunk (curved slightly)
    c.strokeStyle = '#5d4037'; c.lineWidth = 14;
    c.beginPath(); c.moveTo(palmX, h * 0.73);
    c.quadraticCurveTo(palmX + 8, h * 0.55, palmX + 3, palmTopY);
    c.stroke();
    // trunk rings
    c.strokeStyle = '#4e342e'; c.lineWidth = 1;
    for (let r = 0; r < 10; r++) {
      const t = r / 10;
      const rx = palmX + 8 * t * (1 - t) * 4 + (1-t) * 0 + t * 3;
      const ry = h * 0.73 * (1-t) + palmTopY * t;
      c.beginPath(); c.moveTo(rx - 7, ry); c.lineTo(rx + 7, ry); c.stroke();
    }
    // palm fronds (static, drooping naturally)
    const frondAngles = [-2.2, -1.3, -0.5, 0.3, 1.1, 1.9, 2.6];
    for (const fa of frondAngles) {
      c.save(); c.translate(palmX + 3, palmTopY);
      c.rotate(fa * 0.45);
      // frond stem
      c.strokeStyle = '#33691e'; c.lineWidth = 2.5;
      c.beginPath(); c.moveTo(0, 0);
      c.quadraticCurveTo(25, -15, 55, 8);
      c.stroke();
      // leaves along frond
      c.fillStyle = '#2e7d32';
      for (let lf = 0; lf < 8; lf++) {
        const lt = lf / 8;
        const lx = lt * 50 + 5;
        const ly = -15 * lt * (1 - lt) * 4 + lt * 8;
        c.save(); c.translate(lx, ly); c.rotate(0.4 - lt * 0.3);
        c.beginPath(); c.ellipse(0, 0, 12, 3, 0, 0, Math.PI * 2); c.fill();
        c.restore();
        c.save(); c.translate(lx, ly); c.rotate(-0.4 + lt * 0.3);
        c.beginPath(); c.ellipse(0, 0, 12, 3, 0, 0, Math.PI * 2); c.fill();
        c.restore();
      }
      c.restore();
    }

    // second distant palm (smaller)
    c.globalAlpha = 0.4;
    const p2x = w * 0.85;
    c.strokeStyle = '#5d4037'; c.lineWidth = 8;
    c.beginPath(); c.moveTo(p2x, h * 0.73);
    c.quadraticCurveTo(p2x - 5, h * 0.58, p2x + 2, h * 0.42);
    c.stroke();
    c.fillStyle = '#2e7d32';
    for (let fa = 0; fa < 5; fa++) {
      c.save(); c.translate(p2x + 2, h * 0.42); c.rotate((fa - 2) * 0.55);
      c.beginPath(); c.ellipse(20, 0, 25, 5, 0, 0, Math.PI * 2); c.fill();
      c.restore();
    }
    c.globalAlpha = 1;
  }

  function drawBeach(ctx, w, h) {
    const cache = getBeachCache(w, h);
    ctx.drawImage(cache, 0, 0);
  }

  // ---- TROPICAL MUSIC ENGINE ----
  function startTropicalMusic() {
    // always clean up any leftover state first
    if (tropicalPlaying) return;
    if (tropicalTimer) { clearInterval(tropicalTimer); tropicalTimer = null; }
    if (tropicalGain) { try { tropicalGain.disconnect(); } catch(e) {} tropicalGain = null; }
    ensureAudio();
    if (!audioCtx) return;
    tropicalPlaying = true;

    const ctx = audioCtx;
    // create master gain so we can instantly silence all tropical audio on exit
    tropicalGain = ctx.createGain();
    tropicalGain.gain.value = 1;
    tropicalGain.connect(ctx.destination);
    const tropDest = tropicalGain; // all tropical nodes connect here instead of ctx.destination
    let beat = 0;
    let nextTime = ctx.currentTime + 0.1;
    const BPM = 120;

    // steel drum melody — happy, tropical, bouncy
    const melodyNotes = [
      'C5','E5','G5','E5', 'A4','C5','E5','C5',
      'F4','A4','C5','A4', 'G4','B4','D5','G5',
      'E5','G5','C6','G5', 'D5','F5','A5','F5',
      'C5','E5','G5','E5', 'G5','E5','C5','G4',
    ];

    // bass pattern — island groove
    const bassNotes = [
      'C3',null,'G3',null, 'A2',null,'E3',null,
      'F2',null,'C3',null, 'G2',null,'D3','G3',
    ];

    // bongo pattern (0=nothing, 1=low, 2=high, 3=both)
    const bongos = [1,0,2,0, 1,2,0,2, 1,0,2,1, 0,2,1,2];

    // shaker every beat
    function playShaker(time) {
      const buf = ctx.createBuffer(1, ctx.sampleRate * 0.04, ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
      const s = ctx.createBufferSource(); s.buffer = buf;
      const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 6000;
      const g = ctx.createGain(); g.gain.setValueAtTime(0.06, time);
      g.gain.exponentialRampToValueAtTime(0.001, time + 0.05);
      s.connect(hp); hp.connect(g); g.connect(tropDest);
      s.start(time);
    }

    function playBongo(type, time) {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(type === 1 ? 120 : 220, time);
      o.frequency.exponentialRampToValueAtTime(type === 1 ? 60 : 100, time + 0.08);
      g.gain.setValueAtTime(0.12, time);
      g.gain.exponentialRampToValueAtTime(0.001, time + 0.1);
      o.connect(g); g.connect(tropDest);
      o.start(time); o.stop(time + 0.11);
    }

    function playSteelDrum(note, time) {
      if (!note) return;
      const freq = NOTE_FREQS[note];
      if (!freq) return;
      // steel drum = sine with fast attack, medium decay, slight detune
      const o1 = ctx.createOscillator(); const o2 = ctx.createOscillator();
      const g = ctx.createGain();
      o1.type = 'sine'; o1.frequency.value = freq;
      o2.type = 'sine'; o2.frequency.value = freq * 2.01; // harmonic shimmer
      const g2 = ctx.createGain(); g2.gain.value = 0.15;
      g.gain.setValueAtTime(0.14, time);
      g.gain.exponentialRampToValueAtTime(0.04, time + 0.15);
      g.gain.exponentialRampToValueAtTime(0.001, time + 0.4);
      o1.connect(g); o2.connect(g2); g2.connect(g); g.connect(tropDest);
      o1.start(time); o1.stop(time + 0.42);
      o2.start(time); o2.stop(time + 0.42);
    }

    function playTropBass(note, time) {
      if (!note) return;
      const freq = NOTE_FREQS[note];
      if (!freq) return;
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'triangle'; o.frequency.value = freq;
      g.gain.setValueAtTime(0.18, time);
      g.gain.exponentialRampToValueAtTime(0.001, time + 0.3);
      o.connect(g); g.connect(tropDest);
      o.start(time); o.stop(time + 0.32);
    }

    function schedule() {
      if (!tropicalPlaying) return;
      while (nextTime < ctx.currentTime + 0.15) {
        const beatDur = 60 / BPM / 2; // eighth notes
        const melIdx = beat % melodyNotes.length;
        const bassIdx = beat % bassNotes.length;
        const bongoIdx = beat % bongos.length;

        // steel drum melody (every other 8th)
        if (beat % 2 === 0) playSteelDrum(melodyNotes[melIdx], nextTime);

        // bass (every other 8th, offset)
        playTropBass(bassNotes[bassIdx], nextTime);

        // bongos
        const bg = bongos[bongoIdx];
        if (bg === 1 || bg === 3) playBongo(1, nextTime);
        if (bg === 2 || bg === 3) playBongo(2, nextTime);

        // shaker
        playShaker(nextTime);

        nextTime += beatDur;
        beat++;
      }
    }

    tropicalTimer = setInterval(schedule, 25);
  }

  function stopTropicalMusic() {
    tropicalPlaying = false;
    if (tropicalTimer) { clearInterval(tropicalTimer); tropicalTimer = null; }
    // instantly silence any already-scheduled notes
    try {
      if (tropicalGain && audioCtx) {
        tropicalGain.gain.cancelScheduledValues(0);
        tropicalGain.gain.setValueAtTime(0, audioCtx.currentTime);
        setTimeout(() => {
          try { if (tropicalGain) { tropicalGain.disconnect(); tropicalGain = null; } } catch(e) {}
        }, 500); // delay disconnect so scheduled notes hit the zeroed gain first
      }
    } catch(e) { tropicalGain = null; }
  }

  // NOTE_FREQS reference (from MusicEngine scope — re-generate here for isolation)
  const NOTE_FREQS_LOCAL = {};
  const NOTES_LOCAL = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  for (let oct = 0; oct < 8; oct++) {
    for (let i = 0; i < 12; i++) {
      NOTE_FREQS_LOCAL[NOTES_LOCAL[i] + oct] = 440 * Math.pow(2, (oct - 4) + (i - 9) / 12);
    }
  }
  // alias for use inside banana scope
  const NOTE_FREQS = NOTE_FREQS_LOCAL;

  // draw a small Mario 64-style low-poly banana (upright, spinning)
  function drawGodBanana3D(ctx, ox, oy, angle, scale) {
    const cosA = Math.cos(angle), sinA = Math.sin(angle);
    const N = 16; // fewer segments = low-poly N64 feel
    const LEN = 70 * scale;
    const FAT = 14 * scale;
    const FACETS = 5;

    // build spine
    const pts = [];
    for (let i = 0; i <= N; i++) {
      const t = i / N;
      const y3d = -LEN/2 + t * LEN;
      const bendAmt = Math.sin(t * Math.PI) * 14 * scale;
      const x3d = bendAmt;
      const z3d = Math.sin(t * Math.PI) * 4 * scale;
      const taper = Math.sin(Math.pow(t, 0.85) * Math.PI);
      const r = taper * FAT;
      const rx = x3d * cosA - z3d * sinA;
      const rz = x3d * sinA + z3d * cosA;
      pts.push({ x: rx, y: y3d, z: rz, r, t });
    }

    // build verts
    const verts = [];
    for (let i = 0; i <= N; i++) {
      const row = [];
      const p = pts[i];
      for (let f = 0; f < FACETS; f++) {
        const fAngle = (f / FACETS) * Math.PI * 2 + 0.3;
        const lx = Math.cos(fAngle) * p.r;
        const lz = Math.sin(fAngle) * p.r * 0.85;
        const wx = p.x + lx * cosA - lz * sinA;
        const wz = p.z + lx * sinA + lz * cosA;
        row.push({ sx: ox + wx, sy: oy + p.y, z: wz });
      }
      verts.push(row);
    }

    // collect & sort quads
    const quads = [];
    for (let i = 0; i < N; i++) {
      for (let f = 0; f < FACETS; f++) {
        const f2 = (f + 1) % FACETS;
        const v = [verts[i][f], verts[i][f2], verts[i+1][f2], verts[i+1][f]];
        const avgZ = (v[0].z + v[1].z + v[2].z + v[3].z) / 4;
        const fMid = (f + 0.5) / FACETS * Math.PI * 2 + 0.3;
        const nx = Math.cos(fMid) * cosA - Math.sin(fMid) * sinA * 0.85;
        const nzr = Math.cos(fMid) * sinA + Math.sin(fMid) * cosA * 0.85;
        const nl = Math.sqrt(nx*nx + nzr*nzr) || 1;
        const dot = (nx/nl * 0.4 + nzr/nl * 0.7) / 0.806;
        quads.push({ v, avgZ, dot, t: pts[i].t, r: pts[i].r, facet: f });
      }
    }
    quads.sort((a, b) => a.avgZ - b.avgZ);

    // draw — flat shaded, visible polygon edges = N64 style
    for (const q of quads) {
      if (q.r < 0.3) continue;
      const light = 0.3 + Math.max(0, q.dot) * 0.7;
      let bR = 255, bG = 215, bB = 0;
      if (q.t < 0.15) { bG += 25; bB += 20; }
      if (q.t > 0.85) { bR -= 25; bG -= 35; }
      const r = Math.floor(bR * light), g = Math.floor(bG * light), b = Math.floor(bB * light);
      const col = `rgb(${r},${g},${b})`;
      ctx.fillStyle = col;
      ctx.strokeStyle = `rgb(${Math.floor(r*0.75)},${Math.floor(g*0.75)},${Math.floor(b*0.6)})`;
      ctx.lineWidth = 1.2;
      ctx.lineJoin = 'bevel'; // hard edges = N64 feel
      ctx.beginPath();
      ctx.moveTo(q.v[0].sx, q.v[0].sy);
      ctx.lineTo(q.v[1].sx, q.v[1].sy);
      ctx.lineTo(q.v[2].sx, q.v[2].sy);
      ctx.lineTo(q.v[3].sx, q.v[3].sy);
      ctx.closePath();
      ctx.fill();
      ctx.stroke(); // visible edges for that low-poly look
    }

    // stem
    const stemP = pts[0];
    const stemR = Math.max(pts[1].r * 0.4, 2.5) ;
    ctx.fillStyle = '#5a4030';
    ctx.strokeStyle = '#3e2a1a';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(ox + stemP.x - stemR, oy + stemP.y);
    ctx.lineTo(ox + stemP.x - stemR * 0.4, oy + stemP.y - 12 * scale);
    ctx.lineTo(ox + stemP.x + stemR * 0.4, oy + stemP.y - 12 * scale);
    ctx.lineTo(ox + stemP.x + stemR, oy + stemP.y);
    ctx.closePath(); ctx.fill(); ctx.stroke();

    // blossom nub
    const blosP = pts[N];
    ctx.fillStyle = '#3e2a1a';
    ctx.beginPath();
    ctx.moveTo(ox + blosP.x - 2, oy + blosP.y);
    ctx.quadraticCurveTo(ox + blosP.x, oy + blosP.y + 7 * scale, ox + blosP.x + 2, oy + blosP.y);
    ctx.fill();
  }

  // "AI generated video" of a banana doing Gangnam Style, sped up 50x
  function drawGangnamBanana(ctx, w, h, timer) {
    // sped up 50x — everything is comically fast
    const t = timer * 50;
    const phase = t * 0.15; // dance cycle

    // AI video artifacts — slight RGB shift, scanlines, occasional glitch
    ctx.save();

    // glitchy horizontal offset (AI video artifact)
    const glitchAmt = Math.sin(t * 0.37) > 0.92 ? (Math.random() - 0.5) * 20 : 0;
    ctx.translate(glitchAmt, 0);

    // occasional color channel split (AI artifact)
    const channelSplit = Math.sin(t * 0.23) > 0.95;

    // draw the dancing banana figure
    const cx = w / 2;
    const baseY = h * 0.55;

    // horse-riding bounce — the iconic Gangnam Style move
    const bounce = Math.abs(Math.sin(phase * 2)) * 25;
    const leanAngle = Math.sin(phase) * 0.15;

    // banana body (the "person")
    ctx.save();
    ctx.translate(cx, baseY - bounce);
    ctx.rotate(leanAngle);

    // body — banana shaped torso
    const bodyLight = 0.6 + Math.sin(phase * 3) * 0.1;
    const bR = Math.floor(255 * bodyLight);
    const bG = Math.floor(210 * bodyLight);
    const bB = Math.floor(20 * bodyLight);

    // AI color glitch overlay
    if (channelSplit) {
      ctx.fillStyle = `rgba(255,0,0,0.3)`;
      ctx.fillRect(-25, -55, 50, 90);
    }

    // banana torso (curved)
    ctx.fillStyle = `rgb(${bR},${bG},${bB})`;
    ctx.strokeStyle = `rgb(${Math.floor(bR*0.7)},${Math.floor(bG*0.7)},${Math.floor(bB*0.5)})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(0, -15, 18, 40, 0, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();

    // banana face
    ctx.fillStyle = '#1a1a1a';
    // sunglasses (Gangnam Style!)
    ctx.fillRect(-12, -32, 10, 5);
    ctx.fillRect(3, -32, 10, 5);
    ctx.fillRect(-2, -31, 5, 3); // bridge
    // mouth (singing/yelling)
    const mouthOpen = Math.abs(Math.sin(phase * 4)) * 5;
    ctx.fillStyle = '#8B4513';
    ctx.beginPath();
    ctx.ellipse(0, -22, 5, 2 + mouthOpen, 0, 0, Math.PI * 2);
    ctx.fill();

    // stem hat (like PSY's look)
    ctx.fillStyle = '#5a4030';
    ctx.fillRect(-6, -58, 12, 8);
    ctx.fillRect(-10, -50, 20, 4);

    // arms — doing the lasso/horse-riding move
    const armPhase = phase * 2;
    ctx.strokeStyle = `rgb(${bR},${bG},${bB})`;
    ctx.lineWidth = 7;
    ctx.lineCap = 'round';

    // right arm — swinging lasso above head
    const rArmAngle = Math.sin(armPhase) * 1.2 - 0.5;
    ctx.beginPath();
    ctx.moveTo(14, -10);
    ctx.lineTo(14 + Math.cos(rArmAngle) * 30, -10 + Math.sin(rArmAngle) * 30);
    ctx.stroke();
    // lasso hand circle
    ctx.fillStyle = `rgb(${bR},${bG},${bB})`;
    const handX = 14 + Math.cos(rArmAngle) * 32;
    const handY = -10 + Math.sin(rArmAngle) * 32;
    ctx.beginPath(); ctx.arc(handX, handY, 5, 0, Math.PI * 2); ctx.fill();

    // left arm — pointing or pumping
    const lArmAngle = Math.sin(armPhase + Math.PI) * 0.8 + 0.3;
    ctx.beginPath();
    ctx.moveTo(-14, -10);
    ctx.lineTo(-14 + Math.cos(Math.PI + lArmAngle) * 28, -10 + Math.sin(Math.PI + lArmAngle) * 28);
    ctx.stroke();

    // legs — horse riding motion (kicking/stepping)
    ctx.strokeStyle = `rgb(${Math.floor(bR*0.85)},${Math.floor(bG*0.85)},${Math.floor(bB*0.7)})`;
    ctx.lineWidth = 8;

    // right leg
    const rLegKick = Math.sin(armPhase) * 25;
    ctx.beginPath();
    ctx.moveTo(8, 22);
    ctx.lineTo(8 + rLegKick * 0.4, 22 + 28 + Math.abs(rLegKick) * 0.3);
    ctx.stroke();
    // foot
    ctx.fillStyle = '#3a2a1a';
    ctx.beginPath();
    ctx.ellipse(8 + rLegKick * 0.4, 52 + Math.abs(rLegKick) * 0.3, 7, 4, rLegKick * 0.02, 0, Math.PI * 2);
    ctx.fill();

    // left leg
    const lLegKick = Math.sin(armPhase + Math.PI) * 25;
    ctx.beginPath();
    ctx.moveTo(-8, 22);
    ctx.lineTo(-8 + lLegKick * 0.4, 22 + 28 + Math.abs(lLegKick) * 0.3);
    ctx.stroke();
    // foot
    ctx.fillStyle = '#3a2a1a';
    ctx.beginPath();
    ctx.ellipse(-8 + lLegKick * 0.4, 52 + Math.abs(lLegKick) * 0.3, 7, 4, lLegKick * 0.02, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();

    // AI video scanlines
    ctx.fillStyle = '#00000008';
    for (let sy = 0; sy < h; sy += 3) {
      ctx.fillRect(0, sy, w, 1);
    }

    // AI video timestamp/watermark artifact
    ctx.globalAlpha = 0.15 + Math.sin(t * 0.1) * 0.05;
    ctx.font = '10px monospace';
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'left';
    ctx.fillText('AI Generated • 50x Speed', 8, h - 8);
    // occasional frame corruption
    if (Math.sin(t * 0.19) > 0.97) {
      ctx.fillStyle = '#ff000022';
      const gy = Math.random() * h;
      ctx.fillRect(0, gy, w, 3 + Math.random() * 8);
    }
    // color banding artifact
    if (Math.sin(t * 0.31) > 0.93) {
      ctx.fillStyle = `hsla(${(t * 7) % 360},100%,50%,0.06)`;
      ctx.fillRect(0, 0, w, h);
    }

    ctx.globalAlpha = 1;
    ctx.restore();
  }

  // draw banana gods scene
  function drawGodScene(ctx, w, h) {
    godSceneTimer++;

    // heavenly BLUE gradient sky
    const grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, '#1a3a6a');
    grad.addColorStop(0.25, '#3a7bd5');
    grad.addColorStop(0.5, '#6db3f2');
    grad.addColorStop(0.75, '#a8d8ff');
    grad.addColorStop(1, '#d4ecff');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);

    // light rays from behind gate
    ctx.save();
    ctx.translate(w / 2, h * 0.22);
    ctx.globalAlpha = 0.08 + Math.sin(godSceneTimer * 0.03) * 0.03;
    for (let r = 0; r < 16; r++) {
      ctx.fillStyle = '#ffffffaa';
      ctx.save();
      ctx.rotate(r * Math.PI / 8 + godSceneTimer * 0.004);
      ctx.fillRect(-5, 0, 10, h * 0.8);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    // 25% chance: AI video of banana doing Gangnam Style in the background
    if (godSceneDance) {
      ctx.save();
      ctx.globalAlpha = 0.55;
      drawGangnamBanana(ctx, w, h, godSceneTimer);
      ctx.globalAlpha = 1;
      ctx.restore();
    }

    // === STAIRS leading up to the gate ===
    const stairCount = 12;
    const stairStartY = h * 0.72;
    const stairEndY = h * 0.58;
    const stairW = w * 0.5;
    for (let s = 0; s < stairCount; s++) {
      const t = s / stairCount;
      const sy = stairStartY + (stairEndY - stairStartY) * t;
      const sw = stairW - t * (stairW * 0.35); // narrower toward top (perspective)
      const sx = (w - sw) / 2;
      const sh = (stairStartY - stairEndY) / stairCount + 2;
      // stair top face
      const brightness = 200 + Math.floor(t * 40);
      ctx.fillStyle = `rgb(${brightness},${brightness + 10},${brightness + 30})`;
      ctx.fillRect(sx, sy, sw, sh);
      // stair front edge (darker)
      ctx.fillStyle = `rgb(${brightness - 40},${brightness - 30},${brightness})`;
      ctx.fillRect(sx, sy + sh - 3, sw, 3);
      // golden trim
      ctx.fillStyle = '#daa52044';
      ctx.fillRect(sx, sy, sw, 1.5);
    }

    // === GATES OF HEAVEN ===
    const gateY = h * 0.08;
    const gateH = h * 0.52;
    // left pillar
    ctx.fillStyle = '#c9a030';
    ctx.fillRect(w * 0.2, gateY + 20, 28, gateH);
    ctx.fillStyle = '#daa520';
    ctx.fillRect(w * 0.195, gateY + 10, 34, 25);
    ctx.fillStyle = '#e8c040';
    ctx.fillRect(w * 0.205, gateY + 15, 22, 12);
    // right pillar
    ctx.fillStyle = '#c9a030';
    ctx.fillRect(w * 0.77, gateY + 20, 28, gateH);
    ctx.fillStyle = '#daa520';
    ctx.fillRect(w * 0.765, gateY + 10, 34, 25);
    ctx.fillStyle = '#e8c040';
    ctx.fillRect(w * 0.775, gateY + 15, 22, 12);
    // arch
    ctx.strokeStyle = '#daa520';
    ctx.lineWidth = 14;
    ctx.beginPath();
    ctx.arc(w * 0.5, gateY + 30, w * 0.285, Math.PI, 0);
    ctx.stroke();
    // inner arch glow
    ctx.strokeStyle = '#ffd70044';
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.arc(w * 0.5, gateY + 30, w * 0.27, Math.PI, 0);
    ctx.stroke();
    // gate bars
    ctx.strokeStyle = '#ffd70066';
    ctx.lineWidth = 3;
    for (let b = 0; b < 9; b++) {
      const bx = w * 0.24 + b * (w * 0.52 / 9);
      ctx.beginPath();
      ctx.moveTo(bx, gateY + 30);
      ctx.lineTo(bx, gateY + gateH);
      ctx.stroke();
    }

    // 5 colorful spinning bananas orbiting
    const colors = ['#ff4444', '#44ff44', '#4444ff', '#ff44ff', '#44ffff'];
    const centerX = w / 2, centerY = h * 0.38;
    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * Math.PI * 2 + godSceneTimer * 0.03;
      const bx = centerX + Math.cos(a) * 105;
      const by = centerY + Math.sin(a) * 55;
      const sz = 0.3 + (Math.sin(a) + 1) * 0.1; // depth scaling
      drawGodBanana3D(ctx, bx, by, a * 2, sz);
      // tint overlay for color
      ctx.fillStyle = colors[i] + '55';
      ctx.beginPath();
      ctx.ellipse(bx, by, 14, 28, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // === MAIN HOLY BANANA — 3D, upright, Mario 64 style ===
    ctx.save();
    const bob = Math.sin(godSceneTimer * 0.04) * 6;
    const bananaAngle = godSceneTimer * 0.025; // slowly spinning

    // halo above banana
    ctx.strokeStyle = '#ffd700';
    ctx.lineWidth = 4;
    ctx.shadowColor = '#ffd700';
    ctx.shadowBlur = 25;
    ctx.beginPath();
    ctx.ellipse(centerX, centerY - 48 + bob, 30, 10, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.shadowBlur = 0;

    // 4 wings (2 each side)
    ctx.fillStyle = '#ffffffcc';
    for (let side = -1; side <= 1; side += 2) {
      for (let wing = 0; wing < 2; wing++) {
        ctx.save();
        ctx.translate(centerX + side * 18, centerY - 5 + wing * 14 + bob);
        ctx.scale(side, 1);
        const wingFlap = Math.sin(godSceneTimer * 0.08 + wing * 0.5) * 12;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(45, -28 + wingFlap, 75, -6 + wingFlap * 0.5);
        ctx.quadraticCurveTo(45, 12, 0, 5);
        ctx.fill();
        ctx.restore();
      }
    }

    // the 3D banana model itself
    drawGodBanana3D(ctx, centerX, centerY + bob, bananaAngle, 1.0);

    // golden glow around banana
    ctx.fillStyle = '#ffd70018';
    ctx.beginPath();
    ctx.ellipse(centerX, centerY + bob, 50, 55, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();

    // === CLOUDS surrounding the screen border ===
    ctx.save();
    // bottom cloud bank
    for (let c = 0; c < 14; c++) {
      const cx2 = (c * 70 + Math.sin(godSceneTimer * 0.008 + c * 0.7) * 25) % (w + 80) - 40;
      ctx.fillStyle = '#ffffffcc';
      ctx.beginPath();
      ctx.ellipse(cx2, h - 15, 55, 22, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#e8f0ff99';
      ctx.beginPath();
      ctx.ellipse(cx2 + 20, h - 8, 40, 18, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    // top cloud bank
    for (let c = 0; c < 12; c++) {
      const cx2 = (c * 75 + Math.sin(godSceneTimer * 0.006 + c * 1.1) * 20) % (w + 80) - 40;
      ctx.fillStyle = '#ffffffbb';
      ctx.beginPath();
      ctx.ellipse(cx2, 18, 50, 20, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    // left cloud column
    for (let c = 0; c < 8; c++) {
      const cy2 = (c * 65 + Math.sin(godSceneTimer * 0.007 + c * 0.9) * 15) % (h + 60) - 30;
      ctx.fillStyle = '#ffffffaa';
      ctx.beginPath();
      ctx.ellipse(15, cy2, 30, 40, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    // right cloud column
    for (let c = 0; c < 8; c++) {
      const cy2 = (c * 65 + Math.sin(godSceneTimer * 0.007 + c * 1.3 + 2) * 15) % (h + 60) - 30;
      ctx.fillStyle = '#ffffffaa';
      ctx.beginPath();
      ctx.ellipse(w - 15, cy2, 30, 40, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    // text
    ctx.save();
    const textPulse = 1 + Math.sin(godSceneTimer * 0.05) * 0.05;
    ctx.font = `bold ${Math.floor(28 * textPulse)}px monospace`;
    ctx.textAlign = 'center';
    ctx.shadowColor = '#ffd700';
    ctx.shadowBlur = 15;

    if (usedCheat && godSceneCheatMsg) {
      ctx.fillStyle = '#cc0000';
      ctx.fillText('STOP USING CHEAT CODES', w / 2, h * 0.80);
      ctx.fillText('YOU ARE NOT', w / 2, h * 0.86);
      ctx.fillText('A SPEEDRUNNER', w / 2, h * 0.92);
    } else {
      ctx.fillStyle = '#fff';
      ctx.shadowColor = '#3a7bd5';
      ctx.fillText('THE BANANA GODS', w / 2, h * 0.80);
      ctx.fillText('ARE PLEASED WITH YOU', w / 2, h * 0.86);
    }
    ctx.shadowBlur = 0;

    ctx.font = '14px monospace';
    ctx.fillStyle = '#ffffff88';
    ctx.fillText('Press ENTER or click to receive your blessing', w / 2, h * 0.95);
    ctx.restore();
  }

  // handle click at canvas coordinates (0-W, 0-H virtual space)
  function handleClick(cx, cy) {
    if (godScene) {
      // exit god scene → award banana gun (use same path as exitToGame)
      godScene = false;
      bananaGunAwarded = true;
      active = false;
      player.hasBananaGun = true;
      stopTropicalMusic();
      if (!musicMuted) MusicEngine.setVolume(1);
      return;
    }

    // check banana click (center area)
    const bananaX = W * 0.35, bananaY = H * 0.45;
    const dx = cx - bananaX, dy = cy - bananaY;
    if (dx * dx + dy * dy < 80 * 80) {
      clicks += clickPower;
      totalClicks += clickPower;
      targetBananaScale = 1.15;
      clickEffects.push({ x: cx, y: cy, text: '+' + formatNum(clickPower), life: 30, maxLife: 30 });
      playSound('coin');
      return;
    }

    // check upgrade clicks (right panel)
    if (cx > W * 0.58) {
      const panelX = W * 0.6;
      const panelY = 90 - shopScroll;
      for (let i = 0; i < UPGRADES.length; i++) {
        const uy = panelY + i * 52;
        if (uy < 60 || uy > H - 20) continue;
        if (cy > uy && cy < uy + 48 && cx > panelX && cx < panelX + W * 0.37) {
          const upg = UPGRADES[i];
          const cost = getCost(upg);
          if (clicks >= cost) {
            clicks -= cost;
            upg.count++;
            if (upg.type === 'auto') autoClickRate += upg.value;
            else if (upg.type === 'click') clickPower += upg.value;
            else if (upg.type === 'god') {
              godScene = true;
              godSceneTimer = 0;
              // 1 in 525 chance to scold cheaters
              godSceneCheatMsg = usedCheat && Math.random() < (1 / 525);
              godSceneDance = Math.random() < 0.05;
              playSound('win');
            }
            playSound('powerup');
          } else {
            playSound('hurt');
          }
          return;
        }
      }
    }
  }

  function handleScroll(dy) {
    shopScroll += dy * 30;
    const maxScroll = Math.max(0, UPGRADES.length * 52 - (H - 100));
    shopScroll = Math.max(0, Math.min(shopScroll, maxScroll));
  }

  function updateBanana() {
    bananaAngle += 0.025;
    bananaScale += (targetBananaScale - bananaScale) * 0.2;
    targetBananaScale += (1 - targetBananaScale) * 0.1;

    // auto clicks
    const now = performance.now();
    if (lastAutoTick === 0) lastAutoTick = now;
    const dt = (now - lastAutoTick) / 1000;
    if (dt > 0) {
      clicks += autoClickRate * dt;
      totalClicks += autoClickRate * dt;
      lastAutoTick = now;
    }

    // click effects
    for (let i = clickEffects.length - 1; i >= 0; i--) {
      clickEffects[i].y -= 1.5;
      clickEffects[i].life--;
      if (clickEffects[i].life <= 0) clickEffects.splice(i, 1);
    }
  }

  function drawBananaScreen(mainCtx) {
    init();
    updateBanana();

    if (godScene) {
      drawGodScene(mainCtx, W, H);
      return;
    }

    // beach background
    drawBeach(mainCtx, W, H);

    // draw 3D banana to pixelation canvas
    drawBanana3D(bananaAngle);

    // draw pixelated banana (scale up the small canvas with nearest-neighbor)
    const bx = W * 0.35 - PIX_W * bananaScale * 0.5;
    const by = H * 0.45 - PIX_H * bananaScale * 0.5 + Math.sin(performance.now() * 0.002) * 5;
    mainCtx.save();
    mainCtx.imageSmoothingEnabled = false;
    mainCtx.drawImage(pixCanvas, bx, by, PIX_W * bananaScale, PIX_H * bananaScale);
    mainCtx.imageSmoothingEnabled = true;

    // shadow under banana
    mainCtx.fillStyle = '#00000022';
    mainCtx.beginPath();
    mainCtx.ellipse(W * 0.35, H * 0.7, 50, 12, 0, 0, Math.PI * 2);
    mainCtx.fill();
    mainCtx.restore();

    // click counter
    mainCtx.save();
    mainCtx.font = 'bold 36px monospace';
    mainCtx.textAlign = 'center';
    mainCtx.fillStyle = '#fff';
    mainCtx.shadowColor = '#000';
    mainCtx.shadowBlur = 6;
    mainCtx.fillText('🍌 ' + formatNum(clicks), W * 0.35, 40);
    mainCtx.font = '14px monospace';
    mainCtx.fillStyle = '#fffa';
    mainCtx.fillText(formatNum(clickPower) + '/click  |  ' + formatNum(autoClickRate) + '/sec', W * 0.35, 62);
    mainCtx.shadowBlur = 0;
    mainCtx.restore();

    // click effects
    for (const ef of clickEffects) {
      mainCtx.globalAlpha = ef.life / ef.maxLife;
      mainCtx.font = 'bold 18px monospace';
      mainCtx.fillStyle = '#ffd700';
      mainCtx.textAlign = 'center';
      mainCtx.fillText(ef.text, ef.x, ef.y);
    }
    mainCtx.globalAlpha = 1;

    // "click the banana!" hint
    mainCtx.font = '13px monospace';
    mainCtx.fillStyle = '#fff8';
    mainCtx.textAlign = 'center';
    mainCtx.fillText('Click the banana!', W * 0.35, H * 0.82);

    // SHOP PANEL (right side)
    mainCtx.fillStyle = '#00000066';
    mainCtx.fillRect(W * 0.58, 0, W * 0.42, H);

    mainCtx.font = 'bold 20px monospace';
    mainCtx.fillStyle = '#ffd700';
    mainCtx.textAlign = 'center';
    mainCtx.fillText('UPGRADES', W * 0.79, 30);

    // upgrades list
    mainCtx.save();
    mainCtx.beginPath();
    mainCtx.rect(W * 0.58, 45, W * 0.42, H - 70);
    mainCtx.clip();

    for (let i = 0; i < UPGRADES.length; i++) {
      const upg = UPGRADES[i];
      const cost = getCost(upg);
      const canBuy = clicks >= cost;
      const uy = 55 + i * 52 - shopScroll;

      if (uy < 20 || uy > H) continue;

      // bg
      mainCtx.fillStyle = canBuy ? '#ffd70022' : '#ffffff0a';
      mainCtx.fillRect(W * 0.6, uy, W * 0.37, 48);
      // border
      mainCtx.strokeStyle = canBuy ? '#ffd70066' : '#ffffff22';
      mainCtx.lineWidth = 1;
      mainCtx.strokeRect(W * 0.6, uy, W * 0.37, 48);

      // icon + name
      mainCtx.font = '13px monospace';
      mainCtx.textAlign = 'left';
      mainCtx.fillStyle = canBuy ? '#fff' : '#888';
      mainCtx.fillText(upg.icon + ' ' + upg.name + (upg.count > 0 ? ' x' + upg.count : ''), W * 0.62, uy + 18);

      // desc
      mainCtx.font = '10px monospace';
      mainCtx.fillStyle = '#aaa';
      mainCtx.fillText(upg.desc, W * 0.62, uy + 32);

      // cost
      mainCtx.textAlign = 'right';
      mainCtx.font = 'bold 12px monospace';
      mainCtx.fillStyle = canBuy ? '#4ecca3' : '#e94560';
      mainCtx.fillText('🍌' + formatNum(cost), W * 0.95, uy + 25);
    }
    mainCtx.restore();

    // scroll indicators
    const maxScroll = Math.max(0, UPGRADES.length * 52 - (H - 100));
    if (shopScroll > 0) {
      mainCtx.fillStyle = '#ffd700aa';
      mainCtx.font = '16px monospace';
      mainCtx.textAlign = 'center';
      mainCtx.fillText('▲ scroll up ▲', W * 0.79, 55);
    }
    if (shopScroll < maxScroll - 5) {
      mainCtx.fillStyle = '#ffd700aa';
      mainCtx.font = '16px monospace';
      mainCtx.textAlign = 'center';
      mainCtx.fillText('▼ scroll down ▼', W * 0.79, H - 25);
    }

    // return hint
    mainCtx.font = '12px monospace';
    mainCtx.fillStyle = '#fff6';
    mainCtx.textAlign = 'center';
    mainCtx.fillText('Press ENTER or ESC to return to game', W / 2, H - 8);
  }

  // handle cheat code input while banana screen is active
  function checkCheatCode(key) {
    if (!active || godScene) return;
    // map key code to character (handles letters, digits, symbols)
    let ch = '';
    if (key.startsWith('Key')) ch = key.slice(3).toLowerCase();
    else if (key.startsWith('Digit')) ch = key.slice(5);
    else if (key === 'Backquote') ch = '`';
    else if (key === 'Minus') ch = '-';
    else if (key === 'Equal') ch = '=';
    // # via Shift+Digit3
    // We handle this differently — track raw characters

    cheatBuffer += ch;
    if (cheatBuffer.length > CHEAT_CODE.length) cheatBuffer = cheatBuffer.slice(-CHEAT_CODE.length);
  }

  // separate raw key listener for cheat (needs shift detection for #)
  let cheatRawBuffer = '';
  function checkCheatRaw(e) {
    if (!active || godScene) return;
    // get actual typed character
    if (e.key && e.key.length === 1) {
      cheatRawBuffer += e.key.toLowerCase();
      if (cheatRawBuffer.length > CHEAT_CODE.length) cheatRawBuffer = cheatRawBuffer.slice(-CHEAT_CODE.length);
      if (cheatRawBuffer.endsWith(CHEAT_CODE)) {
        cheatRawBuffer = '';
        // CHEAT ACTIVATED!
        clicks += 200000000000; // 200 billion
        usedCheat = true;
        playSound('powerup');
        // visual feedback
        clickEffects.push({ x: W * 0.35, y: H * 0.3, text: '+200B CHEATER!', life: 60, maxLife: 60 });
      }
    }
  }

  return {
    checkSecret(key) {
      if (active || bananaGunAwarded) return false;
      // track typed letters
      const letter = key.replace('Key', '').toLowerCase();
      if (letter.length === 1 && letter >= 'a' && letter <= 'z') {
        secretBuffer += letter;
        if (secretBuffer.length > SECRET.length) secretBuffer = secretBuffer.slice(-SECRET.length);
        if (secretBuffer === SECRET) {
          secretBuffer = '';
          active = true;
          clicks = 0; totalClicks = 0; clickPower = 1; autoClickRate = 0;
          UPGRADES.forEach(u => u.count = 0);
          shopScroll = 0; godScene = false; godMode = false;
          lastAutoTick = 0; usedCheat = false; cheatRawBuffer = '';
          // start tropical music, pause game music
          MusicEngine.setVolume(0);
          startTropicalMusic();
          return true;
        }
      }
      return false;
    },
    checkCheatRaw,
    isActive() { return active; },
    isGodScene() { return godScene; },
    hasBananaGun() { return bananaGunAwarded; },
    handleClick, handleScroll, drawBananaScreen,
    exitToGame() {
      if (godScene) {
        godScene = false;
        bananaGunAwarded = true;
        active = false;
        player.hasBananaGun = true;
      } else {
        active = false;
      }
      // stop tropical, resume game music
      stopTropicalMusic();
      if (!musicMuted) MusicEngine.setVolume(1);
    }
  };
})();

// ============================================================
// BANANA GUN — one-shots everything
// ============================================================
let bananaGunCooldown = 0;
const BANANA_BULLETS = [];

function fireBananaGun() {
  if (bananaGunCooldown > 0) return;
  bananaGunCooldown = 12;
  BANANA_BULLETS.push({
    x: player.x + (player.facing > 0 ? player.w : 0),
    y: player.y + player.h * 0.4,
    vx: player.facing * 16,
    life: 80,
    facing: player.facing,
    angle: 0,
  });
  // banana gun sound — ascending jingle
  try {
    ensureAudio();
    const t = audioCtx.currentTime;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'square';
    o.frequency.setValueAtTime(600, t);
    o.frequency.exponentialRampToValueAtTime(1200, t + 0.08);
    g.gain.setValueAtTime(0.12, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t + 0.12);
  } catch(e) {}
}

function updateBananaBullets() {
  if (bananaGunCooldown > 0) bananaGunCooldown--;

  for (let i = BANANA_BULLETS.length - 1; i >= 0; i--) {
    const b = BANANA_BULLETS[i];
    b.x += b.vx;
    b.angle += 0.3;
    b.life--;

    // hit enemies
    for (const e of level.enemies) {
      if (e.dead) continue;
      if (b.x > e.x - 10 && b.x < e.x + e.w + 10 && b.y > e.y - 10 && b.y < e.y + e.h + 10) {
        e.dead = true;
        score += 200;
        playSound('stomp');
        triggerShake(5, 8);
        spawnParticles(e.x + e.w/2, e.y + e.h/2, 15, '#ffd700', { spread: 6, life: 20, gravity: 0.1 });
        spawnParticles(e.x + e.w/2, e.y + e.h/2, 8, '#e94560', { spread: 4, life: 15 });
        spawnFloatingText(e.x + e.w/2, e.y - 10, '🍌 OBLITERATED!', '#ffd700');
        b.life = 0;
        break;
      }
    }

    if (b.life <= 0) {
      spawnParticles(b.x, b.y, 5, '#ffd700', { spread: 3, life: 10, size: 2 });
      BANANA_BULLETS.splice(i, 1);
    }
  }
}

function drawBananaBullets() {
  for (const b of BANANA_BULLETS) {
    const sx = b.x - camera.x;
    ctx.save();
    ctx.translate(sx, b.y);
    ctx.rotate(b.angle);
    // banana bullet shape
    ctx.fillStyle = '#ffd700';
    ctx.beginPath();
    for (let t = -1; t <= 1; t += 0.1) {
      const px = t * 10;
      const py = -Math.pow(t, 2) * 6 + 3 + t * 2 - 4;
      if (t === -1) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    for (let t = 1; t >= -1; t -= 0.1) {
      const px = t * 10;
      const py = -Math.pow(t, 2) * 6 + 3 + t * 2 + 4;
      ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
    // glow
    ctx.fillStyle = '#ffd70044';
    ctx.beginPath(); ctx.arc(0, 0, 14, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}

// ============================================================
// INTEGRATE BANANA INTO GAME LOOP
// ============================================================

// IMPOSTER easter egg - Among Us crewmate skin
const IMPOSTER_CODE = 'imposter';
let imposterBuffer = '';
let imposterActive = false;

function checkImposterSecret(e) {
  if (Banana.isActive()) return;
  if (state !== 'playing') return;
  const k = e.key.toLowerCase();
  if (k.length === 1 && k >= 'a' && k <= 'z') {
    imposterBuffer += k;
    if (imposterBuffer.length > 20) imposterBuffer = imposterBuffer.slice(-20);
    if (imposterBuffer.endsWith(IMPOSTER_CODE)) {
      imposterActive = !imposterActive;
      player.isCrewmate = imposterActive;
      if (imposterActive) {
        triggerShake(8, 15);
        spawnParticles(player.x + player.w/2, player.y + player.h/2, 30, '#c51111', { spread: 8, life: 30, gravity: 0.05 });
        spawnFloatingText(player.x + player.w/2, player.y - 20, '⛑ SUS!', '#c51111');
        playSound('powerup');
      } else {
        spawnFloatingText(player.x + player.w/2, player.y - 20, 'EJECTED!', '#e94560');
        playSound('hurt');
      }
      imposterBuffer = '';
    }
  }
}

// Override keydown to catch banana secret + gun + banana screen controls
const origKeydown = window.onkeydown;
window.addEventListener('keydown', e => {
  // check banana secret code
  if (!Banana.isActive() && state === 'playing') {
    Banana.checkSecret(e.code);
    checkImposterSecret(e);
  }

  // banana screen controls
  if (Banana.isActive()) {
    // cheat code detection
    Banana.checkCheatRaw(e);
    if (e.code === 'Enter' || e.code === 'Escape') {
      Banana.exitToGame();
      e.preventDefault();
    }
    return;
  }

  // banana gun fire (X or F key)
  if ((e.code === 'KeyX' || e.code === 'KeyF') && player.hasBananaGun && state === 'playing') {
    fireBananaGun();
  }
});

// mouse handling for banana screen
canvas.addEventListener('click', e => {
  if (!Banana.isActive()) return;
  const rect = canvas.getBoundingClientRect();
  const scaleX = W / rect.width;
  const scaleY = H / rect.height;
  const cx = (e.clientX - rect.left) * scaleX;
  const cy = (e.clientY - rect.top) * scaleY;
  Banana.handleClick(cx, cy);
});

canvas.addEventListener('wheel', e => {
  if (!Banana.isActive()) return;
  Banana.handleScroll(e.deltaY > 0 ? 1 : -1);
  e.preventDefault();
}, { passive: false });

// ============================================================
// GAME LOOP (with banana integration)
// ============================================================
function loop() {
  if (Banana.isActive()) {
    const s = S();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(s, 0, 0, s, 0, 0);
    Banana.drawBananaScreen(ctx);
  } else {
    update();
    updateBananaBullets();
    draw();
  }
  requestAnimationFrame(loop);
}

// patch draw to include banana bullets and gun indicator
const origDraw = draw;
draw = function() {
  const s = S();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(s, 0, 0, s, 0, 0);

  const shake = getShakeOffset();
  ctx.save();
  ctx.translate(shake.x, shake.y);

  drawBg();
  drawPlatforms();
  drawPowerups();
  drawCoins();
  drawEnemies();
  drawPlayer();
  drawBananaBullets();
  drawParticles();
  drawFloatingTexts();

  ctx.restore();

  drawHUD();

  // banana gun indicator
  if (player.hasBananaGun) {
    ctx.font = '13px monospace';
    ctx.textAlign = 'left';
    ctx.fillStyle = bananaGunCooldown > 0 ? '#ffd70066' : '#ffd700';
    ctx.fillText('🍌 BANANA GUN [X/F]', 10, H - 10);
  }
};

initGame();
loop();
</script>
