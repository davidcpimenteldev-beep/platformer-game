<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Platformer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #1a1a2e; overflow: hidden; font-family: monospace; }
  body { display: flex; justify-content: center; align-items: center; }
  canvas { display: block; border-radius: 6px; }
  #overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); text-align: center; display: none; z-index: 20; }
  #overlay h1 { font-size: 48px; font-family: monospace; margin-bottom: 10px; }
  #overlay p { font-size: 20px; font-family: monospace; color: #fff; margin-bottom: 20px; }
  .btn { background: #e94560; color: #fff; border: none; padding: 12px 32px; font-size: 18px; font-family: monospace; cursor: pointer; border-radius: 4px; margin: 5px; }
  .btn:hover { background: #c73650; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="overlay">
  <h1 id="overlayTitle"></h1>
  <p id="overlayText"></p>
  <button class="btn" id="overlayBtn"></button>
</div>

<script>
// ============================================================
// AUDIO ENGINE — tiny synth-based sound effects
// ============================================================
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function ensureAudio() { if (!audioCtx) audioCtx = new AudioCtx(); }

function playSound(type) {
  try {
    ensureAudio();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    const t = audioCtx.currentTime;
    switch(type) {
      case 'jump':
        o.type = 'square'; o.frequency.setValueAtTime(300, t); o.frequency.exponentialRampToValueAtTime(600, t+0.1);
        g.gain.setValueAtTime(0.15, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.15);
        o.start(t); o.stop(t+0.15); break;
      case 'walljump':
        o.type = 'square'; o.frequency.setValueAtTime(400, t); o.frequency.exponentialRampToValueAtTime(800, t+0.12);
        g.gain.setValueAtTime(0.12, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.15);
        o.start(t); o.stop(t+0.15); break;
      case 'doublejump':
        o.type = 'triangle'; o.frequency.setValueAtTime(500, t); o.frequency.exponentialRampToValueAtTime(900, t+0.15);
        g.gain.setValueAtTime(0.12, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.18);
        o.start(t); o.stop(t+0.18); break;
      case 'dash':
        o.type = 'sawtooth'; o.frequency.setValueAtTime(200, t); o.frequency.exponentialRampToValueAtTime(80, t+0.2);
        g.gain.setValueAtTime(0.12, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.2);
        o.start(t); o.stop(t+0.2); break;
      case 'coin':
        o.type = 'square'; o.frequency.setValueAtTime(880, t); o.frequency.setValueAtTime(1100, t+0.06);
        g.gain.setValueAtTime(0.1, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.15);
        o.start(t); o.stop(t+0.15); break;
      case 'stomp':
        o.type = 'square'; o.frequency.setValueAtTime(200, t); o.frequency.exponentialRampToValueAtTime(60, t+0.2);
        g.gain.setValueAtTime(0.2, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.25);
        o.start(t); o.stop(t+0.25); break;
      case 'hurt':
        o.type = 'sawtooth'; o.frequency.setValueAtTime(300, t); o.frequency.exponentialRampToValueAtTime(100, t+0.3);
        g.gain.setValueAtTime(0.15, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.35);
        o.start(t); o.stop(t+0.35); break;
      case 'powerup':
        o.type = 'square'; o.frequency.setValueAtTime(400, t);
        o.frequency.setValueAtTime(500, t+0.08); o.frequency.setValueAtTime(600, t+0.16);
        o.frequency.setValueAtTime(800, t+0.24);
        g.gain.setValueAtTime(0.12, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.4);
        o.start(t); o.stop(t+0.4); break;
      case 'spring':
        o.type = 'sine'; o.frequency.setValueAtTime(200, t); o.frequency.exponentialRampToValueAtTime(1200, t+0.2);
        g.gain.setValueAtTime(0.15, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.25);
        o.start(t); o.stop(t+0.25); break;
      case 'break':
        o.type = 'sawtooth'; o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(50, t+0.15);
        g.gain.setValueAtTime(0.15, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.2);
        o.start(t); o.stop(t+0.2); break;
      case 'win':
        o.type = 'square';
        o.frequency.setValueAtTime(523, t); o.frequency.setValueAtTime(659, t+0.15);
        o.frequency.setValueAtTime(784, t+0.3); o.frequency.setValueAtTime(1047, t+0.45);
        g.gain.setValueAtTime(0.12, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.7);
        o.start(t); o.stop(t+0.7); break;
      case 'die':
        o.type = 'square'; o.frequency.setValueAtTime(400, t); o.frequency.exponentialRampToValueAtTime(80, t+0.5);
        g.gain.setValueAtTime(0.15, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.6);
        o.start(t); o.stop(t+0.6); break;
    }
  } catch(e) {}
}

// ============================================================
// MUSIC ENGINE — procedural chiptune → modern crossfade
// ============================================================
const MusicEngine = (() => {
  let ctx = null;
  let masterGain = null;
  let running = false;
  let schedulerTimer = null;
  let nextNoteTime = 0;
  const SCHEDULE_AHEAD = 0.15;
  const LOOKAHEAD_MS = 25;

  // music state
  let beat = 0;
  let bpm = 140;
  let modernBlend = 0;        // 0 = pure 8-bit, 1 = pure modern
  let targetModernBlend = 0;
  let intensity = 0.5;        // 0 = calm, 1 = action
  let targetIntensity = 0.5;

  // channel gains
  let melodyGain, bassGain, arpGain, drumGain, padGain, leadGain;
  // reverb
  let reverbNode;

  // note helpers
  const NOTE_FREQS = {};
  const NOTES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  for (let oct = 0; oct < 8; oct++) {
    for (let i = 0; i < 12; i++) {
      NOTE_FREQS[NOTES[i] + oct] = 440 * Math.pow(2, (oct - 4) + (i - 9) / 12);
    }
  }
  function n(note) { return NOTE_FREQS[note] || 440; }

  // ---- MELODY PATTERNS (Mario-inspired, bouncy and heroic) ----
  // Each pattern = array of { note, dur } where dur is in beats
  const MELODY_PATTERNS = [
    // Pattern A — bouncy adventure theme
    [
      {n:'E5',d:0.5},{n:'E5',d:0.5},{n:null,d:0.5},{n:'E5',d:0.5},
      {n:null,d:0.5},{n:'C5',d:0.5},{n:'E5',d:1},
      {n:'G5',d:1},{n:null,d:1},{n:'G4',d:1},{n:null,d:1},
    ],
    // Pattern B — ascending hero motif
    [
      {n:'C5',d:0.5},{n:'D5',d:0.5},{n:'E5',d:0.5},{n:'G5',d:0.5},
      {n:'A5',d:1},{n:'G5',d:0.5},{n:'E5',d:0.5},
      {n:'F5',d:0.5},{n:'D5',d:0.5},{n:'C5',d:1},{n:null,d:1},
    ],
    // Pattern C — playful action
    [
      {n:'G5',d:0.5},{n:'F#5',d:0.5},{n:'F5',d:0.5},{n:'D#5',d:0.75},
      {n:'E5',d:0.75},{n:'G#4',d:0.5},{n:'A4',d:0.5},{n:'C5',d:0.5},
      {n:null,d:0.25},{n:'A4',d:0.5},{n:'C5',d:0.5},{n:'D5',d:0.75},
    ],
    // Pattern D — triumphant climb
    [
      {n:'C5',d:0.5},{n:'E5',d:0.5},{n:'G5',d:0.5},{n:'C6',d:1},
      {n:'B5',d:0.5},{n:'A5',d:0.5},{n:'G5',d:0.5},
      {n:'A5',d:0.5},{n:'G5',d:0.5},{n:'E5',d:0.5},{n:'C5',d:1},
    ],
  ];

  // ---- BASS PATTERNS ----
  const BASS_PATTERNS = [
    // Bouncy root-fifth
    [{n:'C3',d:1},{n:'G3',d:0.5},{n:'C3',d:0.5},{n:'E3',d:0.5},{n:'G3',d:0.5},{n:'C3',d:1}],
    // Walking bass
    [{n:'C3',d:0.5},{n:'D3',d:0.5},{n:'E3',d:0.5},{n:'G3',d:0.5},{n:'A3',d:0.5},{n:'G3',d:0.5},{n:'E3',d:0.5},{n:'D3',d:0.5}],
    // Driving action
    [{n:'C3',d:0.25},{n:'C3',d:0.25},{n:'G3',d:0.25},{n:'G3',d:0.25},{n:'A#2',d:0.25},{n:'A#2',d:0.25},{n:'F3',d:0.25},{n:'F3',d:0.25}],
  ];

  // ---- CHORD PROGRESSIONS for pads (modern layer) ----
  const CHORD_PROGS = [
    // I - V - vi - IV in C
    [[n('C4'),n('E4'),n('G4')], [n('G3'),n('B3'),n('D4')], [n('A3'),n('C4'),n('E4')], [n('F3'),n('A3'),n('C4')]],
    // I - vi - IV - V
    [[n('C4'),n('E4'),n('G4')], [n('A3'),n('C4'),n('E4')], [n('F3'),n('A3'),n('C4')], [n('G3'),n('B3'),n('D4')]],
  ];

  // ---- ARP PATTERNS ----
  const ARP_NOTES = [
    [n('C5'),n('E5'),n('G5'),n('E5')],
    [n('A4'),n('C5'),n('E5'),n('C5')],
    [n('F4'),n('A4'),n('C5'),n('A4')],
    [n('G4'),n('B4'),n('D5'),n('B4')],
  ];

  // sequencer state
  let melodyIdx = 0, melodyPattern = 0, melodyBeatAccum = 0;
  let bassIdx = 0, bassPattern = 0, bassBeatAccum = 0;
  let chordProg = 0, chordIdx = 0;
  let arpIdx = 0, arpChord = 0;
  let patternBeat = 0;

  function createReverb() {
    const len = ctx.sampleRate * 1.5;
    const buf = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const data = buf.getChannelData(ch);
      for (let i = 0; i < len; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.5);
      }
    }
    const conv = ctx.createConvolver();
    conv.buffer = buf;
    return conv;
  }

  function init() {
    if (ctx) return;
    ctx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (!audioCtx) audioCtx = ctx;

    masterGain = ctx.createGain();
    masterGain.gain.value = 0.35;

    reverbNode = createReverb();
    const reverbGain = ctx.createGain();
    reverbGain.gain.value = 0.25;
    reverbNode.connect(reverbGain);
    reverbGain.connect(masterGain);
    masterGain.connect(ctx.destination);

    // channel setup
    melodyGain = ctx.createGain(); melodyGain.gain.value = 0.18;
    bassGain = ctx.createGain(); bassGain.gain.value = 0.2;
    arpGain = ctx.createGain(); arpGain.gain.value = 0.08;
    drumGain = ctx.createGain(); drumGain.gain.value = 0.25;
    padGain = ctx.createGain(); padGain.gain.value = 0;  // fades in with modern blend
    leadGain = ctx.createGain(); leadGain.gain.value = 0;

    // dry path
    melodyGain.connect(masterGain);
    bassGain.connect(masterGain);
    arpGain.connect(masterGain);
    drumGain.connect(masterGain);
    padGain.connect(masterGain);
    leadGain.connect(masterGain);

    // wet path (reverb) — melody and pad get reverb
    melodyGain.connect(reverbNode);
    padGain.connect(reverbNode);
    leadGain.connect(reverbNode);
  }

  // --- synth voice helpers ---
  function playNote(freq, startTime, duration, type, gainNode, vol, vibrato) {
    if (!freq || !ctx) return;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, startTime);

    if (vibrato) {
      const lfo = ctx.createOscillator();
      const lfoGain = ctx.createGain();
      lfo.frequency.value = vibrato.rate || 5;
      lfoGain.gain.value = vibrato.depth || 3;
      lfo.connect(lfoGain);
      lfoGain.connect(osc.frequency);
      lfo.start(startTime);
      lfo.stop(startTime + duration + 0.05);
    }

    g.gain.setValueAtTime(vol, startTime);
    g.gain.setValueAtTime(vol * 0.8, startTime + duration * 0.6);
    g.gain.exponentialRampToValueAtTime(0.001, startTime + duration);

    osc.connect(g);
    g.connect(gainNode);
    osc.start(startTime);
    osc.stop(startTime + duration + 0.01);
  }

  function playDrum(type, time) {
    if (!ctx) return;
    if (type === 'kick') {
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(150, time);
      osc.frequency.exponentialRampToValueAtTime(40, time + 0.12);
      g.gain.setValueAtTime(0.6, time);
      g.gain.exponentialRampToValueAtTime(0.001, time + 0.15);
      osc.connect(g); g.connect(drumGain);
      osc.start(time); osc.stop(time + 0.16);
    } else if (type === 'snare') {
      // noise burst
      const bufSize = ctx.sampleRate * 0.08;
      const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
      const src = ctx.createBufferSource();
      src.buffer = buf;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.4, time);
      g.gain.exponentialRampToValueAtTime(0.001, time + 0.1);
      // add tone
      const osc = ctx.createOscillator();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(200, time);
      const og = ctx.createGain();
      og.gain.setValueAtTime(0.2, time);
      og.gain.exponentialRampToValueAtTime(0.001, time + 0.06);
      src.connect(g); g.connect(drumGain);
      osc.connect(og); og.connect(drumGain);
      src.start(time); osc.start(time); osc.stop(time + 0.1);
    } else if (type === 'hihat') {
      const bufSize = ctx.sampleRate * 0.03;
      const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
      const src = ctx.createBufferSource();
      src.buffer = buf;
      const hp = ctx.createBiquadFilter();
      hp.type = 'highpass'; hp.frequency.value = 8000;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.15, time);
      g.gain.exponentialRampToValueAtTime(0.001, time + 0.04);
      src.connect(hp); hp.connect(g); g.connect(drumGain);
      src.start(time);
    }
  }

  function playPadChord(freqs, startTime, duration) {
    if (!ctx || !freqs) return;
    for (const freq of freqs) {
      // layer 1: triangle (warm)
      const type1 = modernBlend > 0.5 ? 'sine' : 'triangle';
      playNote(freq, startTime, duration, type1, padGain, 0.12, { rate: 3, depth: 2 });
      // layer 2: detuned sine (shimmer)
      playNote(freq * 1.003, startTime, duration, 'sine', padGain, 0.06, { rate: 4, depth: 1.5 });
    }
  }

  // --- main scheduler ---
  function scheduleBeat(time) {
    const beatDur = 60 / bpm;
    const subBeat = beat % 4;

    // ---- DRUMS ----
    // kick on 1 and 3
    if (subBeat === 0 || subBeat === 2) playDrum('kick', time);
    // snare on 2 and 4
    if (subBeat === 1 || subBeat === 3) playDrum('snare', time);
    // hihats on every beat, 8th notes at higher intensity
    playDrum('hihat', time);
    if (intensity > 0.4) playDrum('hihat', time + beatDur * 0.5);

    // ---- MELODY (8-bit layer) ----
    const mPat = MELODY_PATTERNS[melodyPattern % MELODY_PATTERNS.length];
    if (melodyBeatAccum <= 0 && melodyIdx < mPat.length) {
      const note = mPat[melodyIdx];
      const dur = note.d * beatDur;
      const melType = modernBlend < 0.5 ? 'square' : (modernBlend < 0.8 ? 'triangle' : 'sine');
      const vib = modernBlend > 0.3 ? { rate: 5, depth: 2 + modernBlend * 4 } : null;
      if (note.n) playNote(n(note.n), time, dur * 0.9, melType, melodyGain, 0.5 - modernBlend * 0.15, vib);
      melodyBeatAccum = note.d;
      melodyIdx++;
    }
    melodyBeatAccum -= 1;
    if (melodyIdx >= mPat.length) { melodyIdx = 0; melodyBeatAccum = 0; melodyPattern++; }

    // ---- BASS ----
    const bPatIdx = intensity > 0.6 ? 2 : (intensity > 0.3 ? 1 : 0);
    const bPat = BASS_PATTERNS[bPatIdx % BASS_PATTERNS.length];
    if (bassBeatAccum <= 0 && bassIdx < bPat.length) {
      const note = bPat[bassIdx];
      const dur = note.d * beatDur;
      const bassType = modernBlend < 0.4 ? 'square' : 'sawtooth';
      playNote(n(note.n), time, dur * 0.85, bassType, bassGain, 0.5);
      bassBeatAccum = note.d;
      bassIdx++;
    }
    bassBeatAccum -= 1;
    if (bassIdx >= bPat.length) { bassIdx = 0; bassBeatAccum = 0; }

    // ---- ARPEGGIOS (8-bit sparkle) ----
    if (modernBlend < 0.7) {
      const arpNotes = ARP_NOTES[arpChord % ARP_NOTES.length];
      const arpFreq = arpNotes[arpIdx % arpNotes.length];
      playNote(arpFreq, time, beatDur * 0.2, 'square', arpGain, 0.4 * (1 - modernBlend));
      if (intensity > 0.3) {
        playNote(arpNotes[(arpIdx + 1) % arpNotes.length], time + beatDur * 0.5, beatDur * 0.15, 'square', arpGain, 0.25 * (1 - modernBlend));
      }
      arpIdx++;
      if (arpIdx >= 4) { arpIdx = 0; arpChord++; }
    }

    // ---- PAD CHORDS (modern layer, fades in) ----
    if (modernBlend > 0.15 && subBeat === 0 && (beat % 8 === 0)) {
      const prog = CHORD_PROGS[chordProg % CHORD_PROGS.length];
      const chord = prog[chordIdx % prog.length];
      playPadChord(chord, time, beatDur * 4);
      chordIdx++;
      if (chordIdx >= prog.length) { chordIdx = 0; chordProg++; }
    }

    // ---- MODERN LEAD (appears at high modern blend) ----
    if (modernBlend > 0.6 && subBeat === 0 && beat % 4 === 0) {
      const leadNotes = ['E5','G5','A5','C6','D6'];
      const lNote = leadNotes[Math.floor(beat / 4) % leadNotes.length];
      playNote(n(lNote), time, beatDur * 2, 'sine', leadGain, 0.3, { rate: 6, depth: 5 });
    }

    // ---- UPDATE BLEND AND INTENSITY ----
    modernBlend += (targetModernBlend - modernBlend) * 0.003;
    intensity += (targetIntensity - intensity) * 0.005;

    // update channel volumes based on blend
    padGain.gain.setTargetAtTime(0.12 * modernBlend, time, 0.1);
    leadGain.gain.setTargetAtTime(0.1 * Math.max(0, modernBlend - 0.5) * 2, time, 0.1);
    arpGain.gain.setTargetAtTime(0.08 * (1 - modernBlend * 0.9), time, 0.1);
    melodyGain.gain.setTargetAtTime(0.18 * (0.6 + 0.4 * (1 - modernBlend)), time, 0.1);

    // tempo shifts with intensity
    bpm = 130 + intensity * 30;

    beat++;
    patternBeat++;
  }

  function scheduler() {
    if (!ctx || !running) return;
    while (nextNoteTime < ctx.currentTime + SCHEDULE_AHEAD) {
      scheduleBeat(nextNoteTime);
      nextNoteTime += 60 / bpm;
    }
  }

  return {
    start() {
      init();
      if (running) return;
      running = true;
      beat = 0; patternBeat = 0;
      melodyIdx = 0; melodyPattern = 0; melodyBeatAccum = 0;
      bassIdx = 0; bassPattern = 0; bassBeatAccum = 0;
      chordProg = 0; chordIdx = 0;
      arpIdx = 0; arpChord = 0;
      modernBlend = 0; targetModernBlend = 0;
      intensity = 0.5; targetIntensity = 0.5;
      nextNoteTime = ctx.currentTime + 0.1;
      schedulerTimer = setInterval(scheduler, LOOKAHEAD_MS);
    },
    stop() {
      running = false;
      if (schedulerTimer) { clearInterval(schedulerTimer); schedulerTimer = null; }
    },
    // Set modern blend target (0-1): 0 = chiptune, 1 = modern
    setModernBlend(val) { targetModernBlend = Math.max(0, Math.min(1, val)); },
    // Set intensity (0-1): affects tempo, drum patterns, arp density
    setIntensity(val) { targetIntensity = Math.max(0, Math.min(1, val)); },
    // Set master volume (0-1)
    setVolume(val) { if (masterGain) masterGain.gain.setTargetAtTime(val * 0.35, ctx.currentTime, 0.1); },
    isRunning() { return running; },
    getModernBlend() { return modernBlend; },
    getIntensity() { return intensity; },
  };
})();

// ============================================================
// CONSTANTS
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// Fill the window — internal resolution matches display so it's crisp and large
const ASPECT = 16 / 10;
function sizeCanvas() {
  let w = window.innerWidth;
  let h = window.innerHeight;
  if (w / h > ASPECT) { w = Math.floor(h * ASPECT); } else { h = Math.floor(w / ASPECT); }
  canvas.width = w;
  canvas.height = h;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
}
sizeCanvas();
window.addEventListener('resize', () => { sizeCanvas(); });

// Virtual coords — game logic uses these, draw scales automatically
const W = 800;
const H = 500;
function S() { return canvas.width / W; } // scale factor

const GRAVITY = 0.55;
const JUMP_FORCE = -11.5;
const MOVE_SPEED = 4.5;
const MAX_FALL = 12;
const SCROLL_THRESHOLD = 300;
const COYOTE_TIME = 7;
const JUMP_BUFFER = 8;
const WALL_SLIDE_SPEED = 1.8;
const WALL_JUMP_X = 7;
const WALL_JUMP_Y = -11;
const DASH_SPEED = 14;
const DASH_DURATION = 8;
const DASH_COOLDOWN = 30;

// ============================================================
// INPUT
// ============================================================
const keys = {};
const justPressed = {};
window.addEventListener('keydown', e => {
  if (!keys[e.code]) justPressed[e.code] = true;
  keys[e.code] = true;
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  // start music on first interaction (browser policy requires user gesture)
  if (!MusicEngine.isRunning()) MusicEngine.start();
  // mute toggle
  if (e.code === 'KeyM') { musicMuted = !musicMuted; MusicEngine.setVolume(musicMuted ? 0 : 1); }
});
window.addEventListener('keyup', e => keys[e.code] = false);

// ============================================================
// PARTICLE SYSTEM
// ============================================================
const particles = [];

function spawnParticles(x, y, count, color, opts = {}) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: (opts.vx || 0) + (Math.random() - 0.5) * (opts.spread || 4),
      vy: (opts.vy || 0) + (Math.random() - 0.5) * (opts.spread || 4),
      life: opts.life || (20 + Math.random() * 20),
      maxLife: opts.life || 30,
      size: opts.size || (2 + Math.random() * 3),
      color,
      gravity: opts.gravity !== undefined ? opts.gravity : 0.1,
      shrink: opts.shrink !== undefined ? opts.shrink : true
    });
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += p.gravity;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  for (const p of particles) {
    const alpha = p.life / p.maxLife;
    const sz = p.shrink ? p.size * alpha : p.size;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - camera.x - sz/2, p.y - sz/2, sz, sz);
  }
  ctx.globalAlpha = 1;
}

// ============================================================
// FLOATING TEXT
// ============================================================
const floatingTexts = [];

function spawnFloatingText(x, y, text, color) {
  floatingTexts.push({ x, y, text, color, life: 40, maxLife: 40 });
}

function updateFloatingTexts() {
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    floatingTexts[i].y -= 1;
    floatingTexts[i].life--;
    if (floatingTexts[i].life <= 0) floatingTexts.splice(i, 1);
  }
}

function drawFloatingTexts() {
  ctx.font = 'bold 14px monospace';
  ctx.textAlign = 'center';
  for (const ft of floatingTexts) {
    ctx.globalAlpha = ft.life / ft.maxLife;
    ctx.fillStyle = ft.color;
    ctx.fillText(ft.text, ft.x - camera.x, ft.y);
  }
  ctx.globalAlpha = 1;
}

// ============================================================
// SCREEN SHAKE
// ============================================================
let shakeAmount = 0;
let shakeDuration = 0;
function triggerShake(amount, duration) { shakeAmount = amount; shakeDuration = duration; }
function updateShake() { if (shakeDuration > 0) shakeDuration--; else shakeAmount = 0; }
function getShakeOffset() {
  if (shakeAmount <= 0) return { x: 0, y: 0 };
  return { x: (Math.random()-0.5) * shakeAmount * 2, y: (Math.random()-0.5) * shakeAmount * 2 };
}

    grass: '#4ecca3', dirt: '#8b5e3c', highlight: '#3ab88f', stars: true },

// ============================================================
// LEVEL GENERATION — chunk-based with hand-crafted patterns
// ============================================================
const CHUNKS = [
  // Staircase up
  function(startX, startY, diff) {
    const p = [], e = [], c = [], pw = [];
    let x = startX, y = startY;
    for (let i = 0; i < 3 + diff; i++) {
      const w = 90 + Math.random() * 60;
      p.push({ x, y, w, h: 20 });
      if (Math.random() < 0.5) c.push({ x: x + w/2, y: y - 40, r: 8, collected: false });
      x += w + 40 + Math.random() * 30;
      y -= 40 + Math.random() * 20;
      y = Math.max(y, 80);
    }
    return { platforms: p, enemies: e, coins: c, powerups: pw, endX: x - 40, endY: y + 40 };
  },
  // Flat run with enemies
  function(startX, startY, diff) {
    const p = [], e = [], c = [], pw = [];
    const w = 300 + Math.random() * 200;
    const y = Math.min(startY, H - 60);
    p.push({ x: startX, y, w, h: 20 });
    const enemyCount = 1 + Math.floor(diff * 0.7);
    for (let i = 0; i < enemyCount; i++) {
      const ex = startX + 40 + i * (w / (enemyCount + 1));
      e.push({ x: ex, y: y - 28, w: 24, h: 24, originX: startX + 10, rangeW: w - 20, speed: 1 + Math.random() * diff * 0.3, dir: 1, type: 'walker' });
    }
    for (let i = 0; i < 3; i++) c.push({ x: startX + 40 + i * 40, y: y - 50, r: 8, collected: false });
    return { platforms: p, enemies: e, coins: c, powerups: pw, endX: startX + w, endY: y };
  },
  // Gaps with coins
  function(startX, startY, diff) {
    const p = [], e = [], c = [], pw = [];
    let x = startX, y = Math.min(startY, H - 80);
    for (let i = 0; i < 3 + diff; i++) {
      const w = 60 + Math.random() * 50;
      p.push({ x, y, w, h: 20 });
      const gap = 80 + Math.random() * 40 + diff * 10;
      // coins across gap
      for (let j = 1; j <= 2; j++) c.push({ x: x + w + gap * (j/3), y: y - 30 - j * 15, r: 8, collected: false });
      x += w + gap;
      y += (Math.random() - 0.5) * 40;
      y = Math.min(Math.max(y, 100), H - 60);
    }
    return { platforms: p, enemies: e, coins: c, powerups: pw, endX: x, endY: y };
  },
  // Vertical climb with wall jump opportunities
  function(startX, startY, diff) {
    const p = [], e = [], c = [], pw = [];
    let x = startX, y = Math.min(startY, H - 60);
    const wallH = 120 + diff * 30;
    // left wall
    p.push({ x, y: y - wallH, w: 20, h: wallH + 20 });
    // right wall
    p.push({ x: x + 100, y: y - wallH, w: 20, h: wallH + 20 });
    // small platforms between walls
    for (let i = 0; i < 2 + diff; i++) {
      const side = i % 2 === 0 ? x + 25 : x + 45;
      const py = y - 30 - i * 50;
      p.push({ x: side, y: py, w: 50, h: 12 });
      c.push({ x: side + 25, y: py - 30, r: 8, collected: false });
    }
    // top platform
    p.push({ x: x - 20, y: y - wallH - 20, w: 160, h: 20 });
    return { platforms: p, enemies: e, coins: c, powerups: pw, endX: x + 140, endY: y - wallH - 20 };
  },
  // Moving platforms
  function(startX, startY, diff) {
    const p = [], e = [], c = [], pw = [];
    let x = startX, y = Math.min(startY, H - 100);
    for (let i = 0; i < 2 + diff; i++) {
      p.push({ x: x, y: y, w: 80, h: 16, moving: true, moveAxis: i % 2 === 0 ? 'x' : 'y',
               moveRange: 60 + i * 20, moveSpeed: 0.8 + diff * 0.2, moveOffset: i * 1.5, origX: x, origY: y });
      c.push({ x: x + 40, y: y - 40, r: 8, collected: false });
      x += 140 + Math.random() * 40;
      y += (Math.random() - 0.5) * 60;
      y = Math.min(Math.max(y, 100), H - 80);
    }
    return { platforms: p, enemies: e, coins: c, powerups: pw, endX: x, endY: y };
  },
  // Spring bounce section
  function(startX, startY, diff) {
    const p = [], e = [], c = [], pw = [];
    let x = startX, y = Math.min(startY, H - 60);
    p.push({ x, y, w: 100, h: 20 });
    // spring on platform
    p.push({ x: x + 35, y: y - 16, w: 30, h: 16, isSpring: true, springPower: -18 - diff * 1 });
    // high coin arc from spring
    for (let i = 0; i < 4; i++) {
      c.push({ x: x + 80 + i * 50, y: y - 100 - Math.sin(i * 0.8) * 60, r: 8, collected: false });
    }
    // landing platform
    p.push({ x: x + 250, y: y + 20, w: 120, h: 20 });
    return { platforms: p, enemies: e, coins: c, powerups: pw, endX: x + 370, endY: y + 20 };
  },
  // Breakable bridges
  function(startX, startY, diff) {
    const p = [], e = [], c = [], pw = [];
    let x = startX, y = Math.min(startY, H - 60);
    // solid start
    p.push({ x, y, w: 60, h: 20 });
    x += 60;
    // breakable bridge
    for (let i = 0; i < 4 + diff; i++) {
      p.push({ x: x + i * 36, y, w: 32, h: 14, breakable: true, breakTimer: -1, breakDelay: 25 });
      if (i % 2 === 0) c.push({ x: x + i * 36 + 16, y: y - 35, r: 8, collected: false });
    }
    // safe landing
    const bridgeEnd = x + (4 + diff) * 36;
    p.push({ x: bridgeEnd + 20, y: y - 20, w: 100, h: 20 });
    return { platforms: p, enemies: e, coins: c, powerups: pw, endX: bridgeEnd + 120, endY: y - 20 };
  },
  // Flyer gauntlet
  function(startX, startY, diff) {
    const p = [], e = [], c = [], pw = [];
    let x = startX, y = Math.min(startY, H - 60);
    const w = 250 + diff * 50;
    p.push({ x, y, w, h: 20 });
    const flyCount = 1 + diff;
    for (let i = 0; i < flyCount; i++) {
      e.push({ x: x + 60 + i * 80, y: y - 80 - Math.random() * 40, w: 22, h: 22,
               type: 'flyer', originX: x + 30 + i * 80, originY: y - 80, flyRangeX: 60, flyRangeY: 30,
               flySpeed: 1.5 + diff * 0.3, flyOffset: i * 2, dir: 1 });
    }
    for (let i = 0; i < 4; i++) c.push({ x: x + 30 + i * 50, y: y - 35, r: 8, collected: false });
    return { platforms: p, enemies: e, coins: c, powerups: pw, endX: x + w, endY: y };
  },
  // Shielded enemy arena
  function(startX, startY, diff) {
    const p = [], e = [], c = [], pw = [];
    let y = Math.min(startY, H - 60);
    const w = 200 + diff * 40;
    p.push({ x: startX, y, w, h: 20 });
    // shielded enemy - need to stomp 2 times
    e.push({ x: startX + w/2, y: y - 32, w: 28, h: 28, type: 'shielded', hp: 2,
             originX: startX + 20, rangeW: w - 40, speed: 0.8 + diff * 0.3, dir: 1 });
    c.push({ x: startX + w/2, y: y - 70, r: 8, collected: false });
    return { platforms: p, enemies: e, coins: c, powerups: pw, endX: startX + w, endY: y };
  },
];

function generateLevel(levelNum) {
  const platforms = [];
  const enemies = [];
  const coins = [];
  const powerups = [];
  const theme = THEMES[(levelNum - 1) % THEMES.length];
  const difficulty = Math.min(levelNum, 5);

  // starting platform
  platforms.push({ x: 0, y: H - 40, w: 250, h: 40 });

  let curX = 200;
  let curY = H - 40;
  const targetLength = 3000 + levelNum * 1500;
  let chunkIndex = 0;

  // place a powerup early in each level
  const powerupType = levelNum === 1 ? 'doublejump' : levelNum === 2 ? 'dash' : ['doublejump', 'dash'][Math.floor(Math.random() * 2)];
  let placedPowerup = false;

  while (curX < targetLength) {
    // pick a chunk, weighted by difficulty
    let pool = [...CHUNKS];
    // ensure wall-jump chunk appears in level 1
    if (chunkIndex === 1 && levelNum >= 2) pool = [CHUNKS[3]];
    const chunk = pool[Math.floor(Math.random() * pool.length)];

    const gap = 80 + Math.random() * 60;
    const result = chunk(curX + gap, curY, difficulty);

    platforms.push(...result.platforms);
    enemies.push(...result.enemies);
    coins.push(...result.coins);

    // place powerup in 2nd or 3rd chunk
    if (!placedPowerup && chunkIndex >= 1 && chunkIndex <= 2 && result.platforms.length > 0) {
      const pp = result.platforms[0];
      powerups.push({ x: pp.x + pp.w / 2, y: pp.y - 40, type: powerupType, collected: false });
      placedPowerup = true;
    }

    curX = result.endX;
    curY = result.endY;
    chunkIndex++;
  }

  // goal flag
  const goalY = Math.min(curY, H - 60);
  platforms.push({ x: curX + 100, y: goalY, w: 120, h: 40, isGoal: true });

  return { platforms, enemies, coins, powerups, theme, levelEnd: curX + 220 };
}

// ============================================================
// GAME STATE
// ============================================================
let level, player, camera, score, lives, state, deathTimer, currentLevel, comboCount, comboTimer;
let musicMuted = false;

function makePlayer() {
  return {
    x: 80, y: H - 80, w: 26, h: 34,
    vx: 0, vy: 0,
    grounded: false, facing: 1,
    frame: 0, frameTimer: 0,
    // coyote & buffer
    coyoteTimer: 0, jumpBufferTimer: 0,
    // wall
    wallSliding: false, wallDir: 0, wallJumpTimer: 0,
    // double jump
    hasDoubleJump: false, canDoubleJump: false, usedDoubleJump: false,
    // dash
    hasDash: false, dashing: false, dashTimer: 0, dashCooldown: 0, dashDir: 0,
    // squash & stretch
    scaleX: 1, scaleY: 1, targetScaleX: 1, targetScaleY: 1,
    // trail for dash
    trail: [],
    // was grounded last frame
    wasGrounded: false,
    // for variable jump
    jumpHeld: false,
    // banana gun (easter egg reward)
    hasBananaGun: false,
    // among us crewmate skin
    isCrewmate: false,
  };
}

function initGame() {
  currentLevel = 1;
  score = 0;
  lives = 4;
  comboCount = 0;
  comboTimer = 0;
  startLevel(currentLevel);
}

function startLevel(num) {
  level = generateLevel(num);
  player = makePlayer();
  // carry powerups between levels
  if (num > 1) { player.hasDoubleJump = true; player.hasDash = true; }
  if (Banana.hasBananaGun()) player.hasBananaGun = true;
  if (imposterActive) player.isCrewmate = true;
  camera = { x: 0 };
  state = 'playing';
  deathTimer = 0;
  particles.length = 0;
  floatingTexts.length = 0;
  hideOverlay();
  updateUI();

  // music: evolve from chiptune to modern across levels
  // level 1 = 0 (pure 8-bit), level 2 = 0.45, level 3 = 0.85
  const blend = Math.min(1, (num - 1) * 0.42);
  MusicEngine.setModernBlend(blend);
  MusicEngine.setIntensity(0.4 + num * 0.1);
}

function updateUI() { /* HUD is drawn on canvas in drawHUD() */ }

function showOverlay(title, titleColor, text, btnText, btnAction) {
  const o = document.getElementById('overlay');
  document.getElementById('overlayTitle').textContent = title;
  document.getElementById('overlayTitle').style.color = titleColor;
  document.getElementById('overlayText').textContent = text;
  document.getElementById('overlayBtn').textContent = btnText;
  document.getElementById('overlayBtn').onclick = btnAction;
  o.style.display = 'block';
}

function hideOverlay() { document.getElementById('overlay').style.display = 'none'; }

function respawn() {
  player.x = 80; player.y = H - 80;
  player.vx = 0; player.vy = 0;
  player.dashing = false; player.dashTimer = 0;
  player.wallSliding = false;
  player.scaleX = 1; player.scaleY = 1;
  player.targetScaleX = 1; player.targetScaleY = 1;
  camera.x = 0;
}

function rectCollide(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

// ============================================================
// UPDATE
// ============================================================
function update() {
  if (state !== 'playing') return;

  const t = performance.now() * 0.001;

  // death timer
  if (deathTimer > 0) {
    deathTimer--;
    if (deathTimer === 0) {
      if (lives <= 0) {
        state = 'gameover';
        playSound('die');
        showOverlay('GAME OVER', '#e94560', 'Score: ' + score, 'Try Again', initGame);
        return;
      }
      respawn();
    }
    return;
  }

  // combo decay
  if (comboTimer > 0) { comboTimer--; } else { comboCount = 0; }

  // --- update moving platforms ---
  for (const p of level.platforms) {
    if (p.moving) {
      if (p.moveAxis === 'x') {
        p.x = p.origX + Math.sin(t * p.moveSpeed + p.moveOffset) * p.moveRange;
      } else {
        p.y = p.origY + Math.sin(t * p.moveSpeed + p.moveOffset) * p.moveRange;
      }
    }
    // breakable platform timer
    if (p.breakable && p.breakTimer > 0) {
      p.breakTimer--;
      if (p.breakTimer === 0) {
        p.broken = true;
        playSound('break');
        spawnParticles(p.x + p.w/2, p.y + p.h/2, 8, '#8b5e3c', { spread: 5, gravity: 0.2 });
      }
    }
  }

  // --- input ---
  const wantLeft = keys['ArrowLeft'] || keys['KeyA'];
  const wantRight = keys['ArrowRight'] || keys['KeyD'];
  const wantJump = justPressed['Space'] || justPressed['ArrowUp'] || justPressed['KeyW'];
  const holdJump = keys['Space'] || keys['ArrowUp'] || keys['KeyW'];
  const wantDash = justPressed['ShiftLeft'] || justPressed['ShiftRight'] || justPressed['KeyE'];

  // clear justPressed
  for (const k in justPressed) justPressed[k] = false;

  // jump buffer
  if (wantJump) player.jumpBufferTimer = JUMP_BUFFER;
  if (player.jumpBufferTimer > 0) player.jumpBufferTimer--;

  // horizontal movement (reduced during wall jump)
  if (!player.dashing) {
    if (player.wallJumpTimer > 0) {
      player.wallJumpTimer--;
    } else {
      if (wantLeft) { player.vx = -MOVE_SPEED; player.facing = -1; }
      else if (wantRight) { player.vx = MOVE_SPEED; player.facing = 1; }
      else { player.vx *= 0.7; if (Math.abs(player.vx) < 0.3) player.vx = 0; }
    }
  }

  // --- dash ---
  if (player.dashCooldown > 0) player.dashCooldown--;
  if (wantDash && player.hasDash && !player.dashing && player.dashCooldown <= 0) {
    player.dashing = true;
    player.dashTimer = DASH_DURATION;
    player.dashCooldown = DASH_COOLDOWN;
    player.dashDir = player.facing;
    player.vy = 0;
    playSound('dash');
    triggerShake(2, 5);
    // squash for dash
    player.targetScaleX = 1.4; player.targetScaleY = 0.7;
  }

  if (player.dashing) {
    player.vx = DASH_SPEED * player.dashDir;
    player.vy = 0;
    player.dashTimer--;
    // dash trail
    player.trail.push({ x: player.x, y: player.y, life: 10 });
    spawnParticles(player.x + player.w/2, player.y + player.h/2, 1, '#e9456088', { spread: 2, life: 8, size: 4, gravity: 0 });
    if (player.dashTimer <= 0) {
      player.dashing = false;
      player.vx = player.dashDir * MOVE_SPEED * 0.5;
    }
  }

  // --- gravity (variable jump height) ---
  if (!player.dashing) {
    // if going up and not holding jump, cut the jump short
    if (player.vy < 0 && !holdJump) {
      player.vy += GRAVITY * 2.5; // faster fall = shorter jump
    } else {
      player.vy += GRAVITY;
    }
    if (player.vy > MAX_FALL) player.vy = MAX_FALL;
  }

  // --- wall slide detection ---
  player.wallSliding = false;
  player.wallDir = 0;
  if (!player.grounded && !player.dashing && player.vy > 0) {
    for (const p of level.platforms) {
      if (p.broken || p.isSpring || p.breakable) continue;
      // check left wall
      if (wantLeft && player.x <= p.x + p.w + 2 && player.x >= p.x + p.w - 4 &&
          player.y + player.h > p.y + 4 && player.y < p.y + p.h - 4) {
        player.wallSliding = true; player.wallDir = -1; break;
      }
      // check right wall
      if (wantRight && player.x + player.w >= p.x - 2 && player.x + player.w <= p.x + 4 &&
          player.y + player.h > p.y + 4 && player.y < p.y + p.h - 4) {
        player.wallSliding = true; player.wallDir = 1; break;
      }
    }
  }

  if (player.wallSliding) {
    player.vy = WALL_SLIDE_SPEED;
    player.usedDoubleJump = false; // reset double jump on wall
    // wall slide particles
    if (Math.random() < 0.3) {
      spawnParticles(player.x + (player.wallDir > 0 ? player.w : 0), player.y + player.h * 0.5, 1, '#ffffff44', { spread: 1, life: 10, size: 2, gravity: 0.05 });
    }
  }

  // --- jump logic ---
  const canCoyoteJump = player.coyoteTimer > 0;
  const wantJumpNow = player.jumpBufferTimer > 0;

  if (wantJumpNow) {
    if (player.grounded || canCoyoteJump) {
      // normal jump
      player.vy = JUMP_FORCE;
      player.grounded = false;
      player.coyoteTimer = 0;
      player.jumpBufferTimer = 0;
      player.jumpHeld = true;
      player.usedDoubleJump = false;
      playSound('jump');
      // landing squash reversed to jump stretch
      player.targetScaleX = 0.75; player.targetScaleY = 1.3;
      spawnParticles(player.x + player.w/2, player.y + player.h, 5, '#fff5', { vy: 1, spread: 3, life: 10, size: 3 });
    } else if (player.wallSliding) {
      // wall jump
      player.vy = WALL_JUMP_Y;
      player.vx = -player.wallDir * WALL_JUMP_X;
      player.facing = -player.wallDir;
      player.wallSliding = false;
      player.wallJumpTimer = 8;
      player.jumpBufferTimer = 0;
      player.usedDoubleJump = false;
      playSound('walljump');
      player.targetScaleX = 0.7; player.targetScaleY = 1.35;
      spawnParticles(player.x + (player.wallDir > 0 ? player.w : 0), player.y + player.h/2, 6, '#fff8', { vx: -player.wallDir * 3, spread: 3, life: 12 });
    } else if (player.hasDoubleJump && !player.usedDoubleJump) {
      // double jump
      player.vy = JUMP_FORCE * 0.9;
      player.usedDoubleJump = true;
      player.jumpBufferTimer = 0;
      playSound('doublejump');
      player.targetScaleX = 0.7; player.targetScaleY = 1.35;
      // ring burst effect
      spawnParticles(player.x + player.w/2, player.y + player.h, 10, '#ffd700', { spread: 6, life: 15, size: 3, gravity: 0 });
    }
  }

  // --- move ---
  player.x += player.vx;
  player.y += player.vy;

  // --- platform collision ---
  player.wasGrounded = player.grounded;
  player.grounded = false;

  for (const p of level.platforms) {
    if (p.broken) continue;

    if (rectCollide(player, p)) {
      // spring check
      if (p.isSpring && player.vy > 0) {
        player.vy = p.springPower;
        player.grounded = false;
        player.usedDoubleJump = false;
        playSound('spring');
        triggerShake(3, 4);
        player.targetScaleX = 0.6; player.targetScaleY = 1.5;
        spawnParticles(p.x + p.w/2, p.y, 8, '#ff6b35', { vy: -3, spread: 4, life: 15 });
        continue;
      }

      const overlapBottom = player.y + player.h - p.y;
      const overlapTop = p.y + p.h - player.y;
      const overlapLeft = player.x + player.w - p.x;
      const overlapRight = p.x + p.w - player.x;
      const minOverlap = Math.min(overlapBottom, overlapTop, overlapLeft, overlapRight);

      if (minOverlap === overlapBottom && player.vy >= 0) {
        player.y = p.y - player.h;
        player.vy = 0;
        player.grounded = true;
        player.usedDoubleJump = false;

        // landing effects
        if (!player.wasGrounded) {
          player.targetScaleX = 1.3; player.targetScaleY = 0.7;
          spawnParticles(player.x + player.w/2, player.y + player.h, 5, '#fff3', { vy: -0.5, spread: 3, life: 10, size: 2 });
        }

        // breakable platform trigger
        if (p.breakable && p.breakTimer < 0) {
          p.breakTimer = p.breakDelay;
        }

        // goal
        if (p.isGoal) {
          score += 500 + currentLevel * 200;
          playSound('win');
          updateUI();
          if (currentLevel >= 3) {
            state = 'beatgame';
            showOverlay('YOU WIN!', '#ffd700', 'Final Score: ' + score, 'Play Again', initGame);
          } else {
            state = 'levelcomplete';
            showOverlay('Level Complete!', '#4ecca3', 'Score: ' + score, 'Next Level', () => { currentLevel++; startLevel(currentLevel); });
          }
        }

        // moving platform carry
        if (p.moving && p.moveAxis === 'x') {
          const newX = p.origX + Math.sin(performance.now() * 0.001 * p.moveSpeed + p.moveOffset) * p.moveRange;
          player.x += newX - p.x;
        }
      } else if (minOverlap === overlapTop && player.vy < 0) {
        player.y = p.y + p.h;
        player.vy = 0;
      } else if (minOverlap === overlapLeft) {
        player.x = p.x - player.w;
      } else if (minOverlap === overlapRight) {
        player.x = p.x + p.w;
      }
    }
  }

  // coyote time
  if (player.grounded) { player.coyoteTimer = COYOTE_TIME; }
  else if (player.wasGrounded && !player.grounded) { /* coyote starts */ }
  else { if (player.coyoteTimer > 0) player.coyoteTimer--; }

  // --- fall death ---
  if (player.y > H + 80) {
    lives--;
    deathTimer = 40;
    playSound('hurt');
    triggerShake(5, 10);
    updateUI();
    return;
  }

  // prevent going left of level start
  if (player.x < 0) player.x = 0;

  // --- enemy update ---
  for (const e of level.enemies) {
    if (e.dead) continue;

    if (e.type === 'flyer') {
      e.x = e.originX + Math.sin(t * e.flySpeed + e.flyOffset) * e.flyRangeX;
      e.y = e.originY + Math.cos(t * e.flySpeed * 0.7 + e.flyOffset) * e.flyRangeY;
    } else {
      e.x += e.speed * e.dir;
      if (e.x <= e.originX || e.x + e.w >= e.originX + e.rangeW) e.dir *= -1;
    }

    if (rectCollide(player, e)) {
      const stompCheck = player.vy > 0 && player.y + player.h - e.y < 18;

      if (stompCheck || player.dashing) {
        if (e.type === 'shielded' && e.hp > 1 && !player.dashing) {
          e.hp--;
          player.vy = JUMP_FORCE * 0.6;
          playSound('stomp');
          triggerShake(3, 5);
          spawnParticles(e.x + e.w/2, e.y, 5, '#aaa', { spread: 3, life: 12 });
          spawnFloatingText(e.x + e.w/2, e.y - 10, 'CRACK!', '#ff0');
        } else {
          e.dead = true;
          if (!player.dashing) player.vy = JUMP_FORCE * 0.6;
          comboCount++;
          comboTimer = 60;
          const pts = 100 * comboCount;
          score += pts;
          playSound('stomp');
          triggerShake(4, 6);
          spawnParticles(e.x + e.w/2, e.y + e.h/2, 12, e.type === 'flyer' ? '#e74c3c' : '#9b59b6', { spread: 5, life: 20, gravity: 0.15 });
          if (comboCount > 1) spawnFloatingText(e.x + e.w/2, e.y - 10, comboCount + 'x COMBO! +' + pts, '#ff0');
          else spawnFloatingText(e.x + e.w/2, e.y - 10, '+' + pts, '#fff');
          updateUI();
        }
      } else {
        lives--;
        deathTimer = 40;
        playSound('hurt');
        triggerShake(5, 10);
        spawnParticles(player.x + player.w/2, player.y + player.h/2, 8, '#e94560', { spread: 4, life: 15 });
        updateUI();
        return;
      }
    }
  }

  // --- coin collection ---
  for (const c of level.coins) {
    if (c.collected) continue;
    const dx = player.x + player.w/2 - c.x;
    const dy = player.y + player.h/2 - c.y;
    if (Math.sqrt(dx*dx + dy*dy) < c.r + 14) {
      c.collected = true;
      score += 25;
      playSound('coin');
      spawnParticles(c.x, c.y, 6, '#ffd700', { spread: 3, life: 15, size: 3, gravity: 0 });
      spawnFloatingText(c.x, c.y, '+25', '#ffd700');
      updateUI();
    }
  }

  // --- powerup collection ---
  for (const pu of level.powerups) {
    if (pu.collected) continue;
    const dx = player.x + player.w/2 - pu.x;
    const dy = player.y + player.h/2 - pu.y;
    if (Math.sqrt(dx*dx + dy*dy) < 20) {
      pu.collected = true;
      if (pu.type === 'doublejump') { player.hasDoubleJump = true; spawnFloatingText(pu.x, pu.y, 'DOUBLE JUMP!', '#4ecca3'); }
      if (pu.type === 'dash') { player.hasDash = true; spawnFloatingText(pu.x, pu.y, 'DASH! [Shift]', '#e94560'); }
      playSound('powerup');
      triggerShake(3, 8);
      spawnParticles(pu.x, pu.y, 20, '#fff', { spread: 6, life: 25, size: 4, gravity: -0.05 });
      updateUI();
    }
  }

  // --- animation ---
  const moving = Math.abs(player.vx) > 0.5;
  if (moving && player.grounded) {
    player.frameTimer++;
    if (player.frameTimer > 5) { player.frame = (player.frame + 1) % 4; player.frameTimer = 0; }
    // run particles
    if (player.frame === 1 || player.frame === 3) {
      spawnParticles(player.x + player.w/2, player.y + player.h, 1, '#fff2', { vy: -0.5, spread: 1, life: 8, size: 2, gravity: 0 });
    }
  } else { player.frame = 0; player.frameTimer = 0; }

  // squash & stretch lerp
  player.scaleX += (player.targetScaleX - player.scaleX) * 0.3;
  player.scaleY += (player.targetScaleY - player.scaleY) * 0.3;
  player.targetScaleX += (1 - player.targetScaleX) * 0.15;
  player.targetScaleY += (1 - player.targetScaleY) * 0.15;

  // dash trail decay
  for (let i = player.trail.length - 1; i >= 0; i--) {
    player.trail[i].life--;
    if (player.trail[i].life <= 0) player.trail.splice(i, 1);
  }

  // --- camera ---
  const targetCam = player.x - SCROLL_THRESHOLD;
  camera.x += (targetCam - camera.x) * 0.08;
  if (camera.x < 0) camera.x = 0;

  // --- particles & text ---
  updateParticles();
  updateFloatingTexts();
  updateShake();

  // --- music dynamics ---
  if (MusicEngine.isRunning()) {
    // intensity rises during combat/action, settles during calm exploration
    let dynIntensity = 0.3;
    if (Math.abs(player.vx) > 3) dynIntensity += 0.15;
    if (!player.grounded) dynIntensity += 0.1;
    if (player.dashing) dynIntensity += 0.2;
    if (comboCount > 1) dynIntensity += 0.15;
    // nearby enemies raise tension
    for (const e of level.enemies) {
      if (!e.dead && Math.abs(e.x - player.x) < 300) { dynIntensity += 0.15; break; }
    }
    MusicEngine.setIntensity(Math.min(1, dynIntensity));
    // gradually push modern blend forward as player progresses through the level
    const progress = Math.max(0, camera.x / (level.levelEnd || 5000));
    const levelBase = (currentLevel - 1) * 0.42;
    MusicEngine.setModernBlend(Math.min(1, levelBase + progress * 0.3));
  }
}

// ============================================================
// DRAW
// ============================================================
function drawBg() {
  const theme = level.theme;
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, theme.sky1);
  grad.addColorStop(1, theme.sky2);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // stars (only some themes)
  if (theme.stars) {
    const twinkle = performance.now() * 0.001;
    ctx.fillStyle = '#ffffff44';
    for (let i = 0; i < 60; i++) {
      const sx = (i * 173 + 50) % W;
      const sy = (i * 97 + 20) % (H * 0.4);
      const brightness = 0.3 + 0.7 * Math.abs(Math.sin(twinkle + i * 0.7));
      ctx.globalAlpha = brightness * 0.4;
      ctx.fillRect(sx, sy, 2, 2);
    }
    ctx.globalAlpha = 1;
  }

  // parallax mountains
  ctx.fillStyle = theme.mountain;
  for (let i = 0; i < 12; i++) {
    const mx = i * 200 - ((camera.x * 0.1) % 200 + 200) % 200;
    const mh = 80 + Math.sin(i * 2.3) * 50;
    ctx.beginPath();
    ctx.moveTo(mx, H); ctx.lineTo(mx + 60, H - mh * 0.7); ctx.lineTo(mx + 100, H - mh); ctx.lineTo(mx + 140, H - mh * 0.6); ctx.lineTo(mx + 200, H);
    ctx.fill();
  }

  // parallax hills
  ctx.fillStyle = theme.hill;
  for (let i = 0; i < 16; i++) {
    const hx = i * 140 - ((camera.x * 0.25) % 140 + 140) % 140;
    const hh = 40 + Math.sin(i * 1.7) * 25;
    ctx.beginPath();
    ctx.moveTo(hx, H); ctx.quadraticCurveTo(hx + 70, H - hh * 1.3, hx + 140, H);
    ctx.fill();
  }

  // clouds (sky theme) or floating particles
  if (level.theme.name === 'Sky') {
    ctx.fillStyle = '#ffffff30';
    const ct = performance.now() * 0.00005;
    for (let i = 0; i < 8; i++) {
      const cx = (i * 250 + ct * 500 * (1 + i * 0.3) - camera.x * 0.05) % (W + 200) - 100;
      const cy = 40 + i * 40;
      ctx.beginPath();
      ctx.ellipse(cx, cy, 50 + i * 5, 15 + i * 2, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function drawPlatforms() {
  const theme = level.theme;
  for (const p of level.platforms) {
    if (p.broken) continue;
    const sx = p.x - camera.x;
    if (sx + p.w < -50 || sx > W + 50) continue;

    if (p.isGoal) {
      // flag pole
      ctx.fillStyle = '#aaa';
      ctx.fillRect(sx + 55, p.y - 80, 4, 80);
      // flag
      const flagWave = Math.sin(performance.now() * 0.003) * 3;
      ctx.fillStyle = '#ffd700';
      ctx.beginPath();
      ctx.moveTo(sx + 59, p.y - 78);
      ctx.lineTo(sx + 90 + flagWave, p.y - 65);
      ctx.lineTo(sx + 59, p.y - 50);
      ctx.fill();
      // platform
      ctx.fillStyle = '#ffd700';
      ctx.fillRect(sx, p.y, p.w, p.h);
      ctx.fillStyle = '#daa520';
      ctx.fillRect(sx, p.y + 4, p.w, p.h - 4);
    } else if (p.isSpring) {
      // spring coil
      const bounce = Math.sin(performance.now() * 0.01) * 2;
      ctx.fillStyle = '#ff6b35';
      ctx.fillRect(sx + 4, p.y + 4 + bounce, p.w - 8, p.h - 4);
      ctx.fillStyle = '#ffa060';
      ctx.fillRect(sx + 2, p.y + bounce, p.w - 4, 5);
      // coil lines
      ctx.strokeStyle = '#cc4400';
      ctx.lineWidth = 2;
      for (let i = 0; i < 3; i++) {
        const ly = p.y + 6 + i * 4 + bounce * 0.5;
        ctx.beginPath(); ctx.moveTo(sx + 6, ly); ctx.lineTo(sx + p.w - 6, ly); ctx.stroke();
      }
    } else if (p.breakable) {
      const shake = p.breakTimer > 0 ? (Math.random() - 0.5) * 3 : 0;
      const alpha = p.breakTimer > 0 ? 0.5 + 0.5 * (p.breakTimer / p.breakDelay) : 1;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = '#8b6e3c';
      ctx.fillRect(sx + shake, p.y, p.w, p.h);
      // crack lines
      ctx.strokeStyle = '#5a3a1a';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(sx + p.w * 0.3 + shake, p.y); ctx.lineTo(sx + p.w * 0.5 + shake, p.y + p.h); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(sx + p.w * 0.7 + shake, p.y); ctx.lineTo(sx + p.w * 0.6 + shake, p.y + p.h); ctx.stroke();
      ctx.globalAlpha = 1;
    } else if (p.moving) {
      ctx.fillStyle = theme.grass;
      ctx.fillRect(sx, p.y, p.w, 5);
      ctx.fillStyle = '#6a6aaa';
      ctx.fillRect(sx, p.y + 5, p.w, p.h - 5);
      // glow edge
      ctx.fillStyle = '#8888cc44';
      ctx.fillRect(sx - 1, p.y - 1, p.w + 2, 2);
    } else {
      // normal platform
      ctx.fillStyle = theme.grass;
      ctx.fillRect(sx, p.y, p.w, Math.min(6, p.h));
      ctx.fillStyle = theme.dirt;
      ctx.fillRect(sx, p.y + Math.min(6, p.h), p.w, p.h - Math.min(6, p.h));
      ctx.fillStyle = theme.highlight;
      ctx.fillRect(sx, p.y, p.w, 2);
      // grass tufts
      ctx.fillStyle = theme.grass;
      for (let gx = 0; gx < p.w; gx += 12) {
        ctx.fillRect(sx + gx + 2, p.y - 2, 2, 3);
        ctx.fillRect(sx + gx + 6, p.y - 3, 2, 4);
      }
    }
  }
}

function drawCrewmate() {
  // Among Us crewmate rendering
  const sx = player.x - camera.x;
  const sy = player.y;

  // dash trail (red ghost)
  for (const tr of player.trail) {
    const alpha = tr.life / 10;
    ctx.globalAlpha = alpha * 0.3;
    ctx.fillStyle = '#c51111';
    ctx.beginPath();
    ctx.ellipse(tr.x - camera.x + player.w/2, tr.y + player.h/2, 11, 15, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  ctx.save();
  const cx = sx + player.w / 2;
  const cy = sy + player.h / 2;
  ctx.translate(cx, cy);
  ctx.scale(player.facing * player.scaleX, player.scaleY);
  ctx.translate(-player.w / 2, -player.h / 2);

  const bodyColor = player.dashing ? '#ff4444' : '#c51111';
  const darkBody = player.dashing ? '#cc2222' : '#8b0000';
  const pw = player.w; // 26
  const ph = player.h; // 34

  // === BACKPACK (draw first, behind body) ===
  ctx.fillStyle = darkBody;
  ctx.beginPath();
  ctx.ellipse(-2, ph * 0.45, 5, 9, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#00000033';
  ctx.lineWidth = 1;
  ctx.stroke();

  // === BODY (bean shape) ===
  ctx.fillStyle = bodyColor;
  ctx.beginPath();
  // top dome
  ctx.ellipse(pw/2, 10, 12, 11, 0, Math.PI, 0);
  // right side down
  ctx.lineTo(pw/2 + 12, ph - 8);
  // right leg gap
  ctx.lineTo(pw/2 + 4, ph - 4);
  ctx.lineTo(pw/2 + 4, ph);
  // right leg bottom (with walking)
  if (player.grounded && Math.abs(player.vx) > 0.5) {
    const legOff = Math.sin(performance.now() * 0.012) * 3;
    ctx.lineTo(pw/2 + 4, ph + legOff);
    ctx.lineTo(pw/2 + 12, ph + legOff);
    ctx.lineTo(pw/2 + 12, ph - 4 + legOff);
    // gap
    ctx.lineTo(pw/2 + 2, ph - 4);
    ctx.lineTo(pw/2 - 2, ph - 4);
    // left leg
    ctx.lineTo(pw/2 - 12, ph - 4 - legOff);
    ctx.lineTo(pw/2 - 12, ph - legOff);
    ctx.lineTo(pw/2 - 4, ph - legOff);
    ctx.lineTo(pw/2 - 4, ph - 4);
  } else if (!player.grounded) {
    // floating legs
    ctx.lineTo(pw/2 + 12, ph + 2);
    ctx.lineTo(pw/2 + 12, ph - 2);
    ctx.lineTo(pw/2 + 2, ph - 6);
    ctx.lineTo(pw/2 - 2, ph - 6);
    ctx.lineTo(pw/2 - 12, ph - 2);
    ctx.lineTo(pw/2 - 12, ph + 2);
    ctx.lineTo(pw/2 - 4, ph + 2);
    ctx.lineTo(pw/2 - 4, ph - 4);
  } else if (player.wallSliding) {
    ctx.lineTo(pw/2 + 12, ph + 1);
    ctx.lineTo(pw/2 + 12, ph - 5);
    ctx.lineTo(pw/2 + 2, ph - 5);
    ctx.lineTo(pw/2 - 2, ph - 5);
    ctx.lineTo(pw/2 - 12, ph - 3);
    ctx.lineTo(pw/2 - 12, ph + 3);
    ctx.lineTo(pw/2 - 4, ph + 3);
    ctx.lineTo(pw/2 - 4, ph - 4);
  } else {
    // idle legs
    ctx.lineTo(pw/2 + 12, ph);
    ctx.lineTo(pw/2 + 12, ph - 4);
    ctx.lineTo(pw/2 + 2, ph - 4);
    ctx.lineTo(pw/2 - 2, ph - 4);
    ctx.lineTo(pw/2 - 12, ph - 4);
    ctx.lineTo(pw/2 - 12, ph);
    ctx.lineTo(pw/2 - 4, ph);
    ctx.lineTo(pw/2 - 4, ph - 4);
  }
  ctx.lineTo(pw/2 - 12, ph - 8);
  ctx.closePath();
  ctx.fill();

  // body outline
  ctx.strokeStyle = '#00000044';
  ctx.lineWidth = 1;
  ctx.stroke();

  // === VISOR (cyan glass) ===
  ctx.fillStyle = '#88cfec';
  ctx.beginPath();
  // visor sits on right side of "face"
  ctx.ellipse(pw/2 + 4, 10, 8, 7, 0, -Math.PI * 0.6, Math.PI * 0.6);
  ctx.closePath();
  ctx.fill();

  // visor shine
  ctx.fillStyle = '#bde8f7';
  ctx.beginPath();
  ctx.ellipse(pw/2 + 6, 8, 4, 3, -0.3, 0, Math.PI * 2);
  ctx.fill();

  // visor outline
  ctx.strokeStyle = '#5a9cb5';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.ellipse(pw/2 + 4, 10, 8, 7, 0, -Math.PI * 0.6, Math.PI * 0.6);
  ctx.stroke();

  // === SHADOW on body ===
  ctx.fillStyle = '#00000015';
  ctx.fillRect(pw/2 - 10, 14, 20, 12);

  // double jump halo
  if (player.hasDoubleJump && !player.usedDoubleJump && !player.grounded) {
    ctx.strokeStyle = '#ffd70066';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(player.w / 2, player.h + 4, 12, 0, Math.PI * 2);
    ctx.stroke();
  }

  ctx.restore();

  // dash cooldown indicator
  if (player.hasDash && player.dashCooldown > 0) {
    const pct = 1 - player.dashCooldown / DASH_COOLDOWN;
    ctx.fillStyle = '#c5111144';
    ctx.fillRect(sx, sy + player.h + 4, player.w, 3);
    ctx.fillStyle = '#c51111';
    ctx.fillRect(sx, sy + player.h + 4, player.w * pct, 3);
  }
}

function drawPlayer() {
  if (deathTimer > 0 && deathTimer % 4 < 2) return;

  // Use crewmate renderer if IMPOSTER mode is active
  if (player.isCrewmate) {
    drawCrewmate();
    return;
  }

  const sx = player.x - camera.x;
  const sy = player.y;

  // dash trail
  for (const tr of player.trail) {
    const alpha = tr.life / 10;
    ctx.globalAlpha = alpha * 0.3;
    ctx.fillStyle = '#e94560';
    ctx.fillRect(tr.x - camera.x + 2, tr.y + 8, player.w - 4, player.h - 8);
    ctx.globalAlpha = 1;
  }

  ctx.save();
  const cx = sx + player.w / 2;
  const cy = sy + player.h / 2;
  ctx.translate(cx, cy);
  ctx.scale(player.facing * player.scaleX, player.scaleY);
  ctx.translate(-player.w / 2, -player.h / 2);

  // body
  ctx.fillStyle = player.dashing ? '#ff6b8a' : '#e94560';
  ctx.fillRect(3, 10, 20, 16);

  // head
  ctx.fillStyle = '#f5c6a0';
  ctx.fillRect(5, 0, 16, 13);

  // eye (direction aware)
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(15, 4, 4, 4);
  // eye shine
  ctx.fillStyle = '#fff';
  ctx.fillRect(16, 4, 2, 2);

  // mouth
  ctx.fillStyle = '#c9956a';
  ctx.fillRect(15, 9, 4, 2);

  // arm
  ctx.fillStyle = '#c73650';
  if (player.dashing) {
    ctx.fillRect(20, 12, 8, 5);
  } else if (!player.grounded) {
    ctx.fillRect(1, 10, 5, 8);
  } else {
    ctx.fillRect(0, 14, 5, 8);
  }

  // legs
  ctx.fillStyle = '#c73650';
  if (player.wallSliding) {
    ctx.fillRect(4, 26, 8, 8);
    ctx.fillRect(14, 24, 8, 6);
  } else if (player.dashing) {
    ctx.fillRect(3, 26, 7, 8);
    ctx.fillRect(16, 28, 7, 6);
  } else if (player.grounded && Math.abs(player.vx) > 0.5) {
    const legOffset = [0, 4, 0, -4][player.frame];
    ctx.fillRect(5, 26, 7, 8 + legOffset);
    ctx.fillRect(14, 26, 7, 8 - legOffset);
  } else if (!player.grounded) {
    ctx.fillRect(3, 24, 7, 10);
    ctx.fillRect(16, 26, 7, 8);
  } else {
    ctx.fillRect(5, 26, 7, 8);
    ctx.fillRect(14, 26, 7, 8);
  }

  // double jump halo
  if (player.hasDoubleJump && !player.usedDoubleJump && !player.grounded) {
    ctx.strokeStyle = '#ffd70066';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(player.w / 2, player.h + 4, 12, 0, Math.PI * 2);
    ctx.stroke();
  }

  ctx.restore();

  // dash cooldown indicator
  if (player.hasDash && player.dashCooldown > 0) {
    const pct = 1 - player.dashCooldown / DASH_COOLDOWN;
    ctx.fillStyle = '#e9456044';
    ctx.fillRect(sx, sy + player.h + 4, player.w, 3);
    ctx.fillStyle = '#e94560';
    ctx.fillRect(sx, sy + player.h + 4, player.w * pct, 3);
  }
}

function drawEnemies() {
  for (const e of level.enemies) {
    if (e.dead) continue;
    const sx = e.x - camera.x;
    if (sx + e.w < -50 || sx > W + 50) continue;

    if (e.type === 'flyer') {
      // bat-like flyer
      const wingAngle = Math.sin(performance.now() * 0.01) * 0.3;
      ctx.fillStyle = '#e74c3c';
      ctx.fillRect(sx + 4, e.y + 6, e.w - 8, e.h - 8);
      // wings
      ctx.fillStyle = '#c0392b';
      ctx.save();
      ctx.translate(sx + e.w/2, e.y + e.h/2);
      // left wing
      ctx.fillRect(-e.w/2 - 8, -4 + wingAngle * 10, 10, 8);
      // right wing
      ctx.fillRect(e.w/2 - 2, -4 - wingAngle * 10, 10, 8);
      ctx.restore();
      // eyes
      ctx.fillStyle = '#fff';
      ctx.fillRect(sx + 5, e.y + 8, 4, 4);
      ctx.fillRect(sx + 13, e.y + 8, 4, 4);
      ctx.fillStyle = '#ff0';
      ctx.fillRect(sx + 6, e.y + 9, 2, 2);
      ctx.fillRect(sx + 14, e.y + 9, 2, 2);
    } else if (e.type === 'shielded') {
      // armored enemy
      ctx.fillStyle = e.hp > 1 ? '#7f8c8d' : '#9b59b6';
      ctx.fillRect(sx, e.y, e.w, e.h);
      if (e.hp > 1) {
        // armor plates
        ctx.fillStyle = '#95a5a6';
        ctx.fillRect(sx + 2, e.y + 2, e.w - 4, 6);
        ctx.fillRect(sx - 2, e.y + 4, e.w + 4, 4);
      }
      // spikes
      ctx.fillStyle = '#8e44ad';
      for (let s = 0; s < 3; s++) {
        ctx.beginPath();
        ctx.moveTo(sx + 4 + s * 9, e.y);
        ctx.lineTo(sx + 8 + s * 9, e.y - 6);
        ctx.lineTo(sx + 12 + s * 9, e.y);
        ctx.fill();
      }
      // eyes
      ctx.fillStyle = '#fff';
      ctx.fillRect(sx + 5, e.y + 10, 5, 5);
      ctx.fillRect(sx + 17, e.y + 10, 5, 5);
      ctx.fillStyle = '#e74c3c';
      ctx.fillRect(sx + 7, e.y + 12, 3, 3);
      ctx.fillRect(sx + 19, e.y + 12, 3, 3);
    } else {
      // walker
      const bob = Math.sin(performance.now() * 0.005 + e.x) * 1.5;
      ctx.fillStyle = '#9b59b6';
      ctx.fillRect(sx, e.y + bob, e.w, e.h);
      // spikes
      ctx.fillStyle = '#8e44ad';
      for (let s = 0; s < 3; s++) {
        ctx.beginPath();
        ctx.moveTo(sx + 3 + s * 8, e.y + bob);
        ctx.lineTo(sx + 7 + s * 8, e.y - 6 + bob);
        ctx.lineTo(sx + 11 + s * 8, e.y + bob);
        ctx.fill();
      }
      // eyes
      ctx.fillStyle = '#fff';
      ctx.fillRect(sx + 4, e.y + 6 + bob, 5, 5);
      ctx.fillRect(sx + 14, e.y + 6 + bob, 5, 5);
      ctx.fillStyle = '#1a1a2e';
      ctx.fillRect(sx + 6, e.y + 8 + bob, 3, 3);
      ctx.fillRect(sx + 16, e.y + 8 + bob, 3, 3);
      // feet animation
      ctx.fillStyle = '#7d3c98';
      const footAnim = Math.sin(performance.now() * 0.008 + e.x) * 2;
      ctx.fillRect(sx + 2, e.y + e.h + bob, 6, 4 + footAnim);
      ctx.fillRect(sx + e.w - 8, e.y + e.h + bob, 6, 4 - footAnim);
    }
  }
}

function drawCoins() {
  const t = performance.now() * 0.003;
  for (const c of level.coins) {
    if (c.collected) continue;
    const sx = c.x - camera.x;
    if (sx < -20 || sx > W + 20) continue;
    const bob = Math.sin(t + c.x * 0.05) * 3;
    // glow
    ctx.fillStyle = '#ffd70022';
    ctx.beginPath(); ctx.arc(sx, c.y + bob, c.r + 4, 0, Math.PI * 2); ctx.fill();
    // coin
    ctx.fillStyle = '#ffd700';
    ctx.beginPath(); ctx.arc(sx, c.y + bob, c.r, 0, Math.PI * 2); ctx.fill();
    // shine
    ctx.fillStyle = '#fff6';
    ctx.beginPath(); ctx.arc(sx - 2, c.y + bob - 2, c.r * 0.35, 0, Math.PI * 2); ctx.fill();
    // $ symbol
    ctx.fillStyle = '#b8860b';
    ctx.font = 'bold 9px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('$', sx, c.y + bob + 3);
  }
}

function drawPowerups() {
  const t = performance.now() * 0.003;
  for (const pu of level.powerups) {
    if (pu.collected) continue;
    const sx = pu.x - camera.x;
    if (sx < -30 || sx > W + 30) continue;

    const bob = Math.sin(t * 1.5 + pu.x * 0.03) * 5;
    const glow = 0.3 + 0.2 * Math.sin(t * 2);

    // outer glow
    ctx.fillStyle = pu.type === 'doublejump' ? `rgba(78,204,163,${glow})` : `rgba(233,69,96,${glow})`;
    ctx.beginPath(); ctx.arc(sx, pu.y + bob, 18, 0, Math.PI * 2); ctx.fill();

    // box
    ctx.fillStyle = pu.type === 'doublejump' ? '#4ecca3' : '#e94560';
    ctx.fillRect(sx - 12, pu.y - 12 + bob, 24, 24);
    ctx.fillStyle = '#fff';
    ctx.fillRect(sx - 10, pu.y - 10 + bob, 20, 20);
    ctx.fillStyle = pu.type === 'doublejump' ? '#4ecca3' : '#e94560';
    ctx.font = 'bold 12px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(pu.type === 'doublejump' ? '2x' : '>>', sx, pu.y + 4 + bob);

    // rotating sparkles
    for (let i = 0; i < 4; i++) {
      const angle = t * 2 + i * Math.PI / 2;
      const sparkX = sx + Math.cos(angle) * 20;
      const sparkY = pu.y + bob + Math.sin(angle) * 20;
      ctx.fillStyle = '#fff8';
      ctx.fillRect(sparkX - 1, sparkY - 1, 3, 3);
    }
  }
}

function drawHUD() {
  ctx.save();

  // dark bar at top for readability
  ctx.fillStyle = '#0006';
  ctx.fillRect(0, 0, W, 32);

  ctx.font = 'bold 16px monospace';
  ctx.textAlign = 'left';

  // score
  ctx.fillStyle = '#ffd700';
  ctx.fillText('Score: ' + score, 12, 22);

  // hearts
  ctx.fillStyle = '#e94560';
  for (let i = 0; i < lives; i++) {
    const hx = 180 + i * 22;
    ctx.beginPath();
    ctx.moveTo(hx, 18); ctx.bezierCurveTo(hx, 12, hx - 8, 10, hx - 8, 16);
    ctx.bezierCurveTo(hx - 8, 20, hx, 24, hx, 26);
    ctx.bezierCurveTo(hx, 24, hx + 8, 20, hx + 8, 16);
    ctx.bezierCurveTo(hx + 8, 10, hx, 12, hx, 18);
    ctx.fill();
  }

  // level name
  ctx.fillStyle = '#4ecca3';
  ctx.textAlign = 'center';
  ctx.fillText(level.theme.name + ' - Level ' + currentLevel, W / 2, 22);

  // powerups
  ctx.textAlign = 'right';
  ctx.font = '13px monospace';
  let pwX = W - 12;
  if (player.hasDash) {
    const ready = player.dashCooldown <= 0;
    ctx.fillStyle = ready ? '#e94560' : '#e9456066';
    ctx.fillText(ready ? '[Dash]' : '[dash...]', pwX, 22);
    pwX -= 70;
  }
  if (player.hasDoubleJump) {
    ctx.fillStyle = player.usedDoubleJump && !player.grounded ? '#4ecca366' : '#4ecca3';
    ctx.fillText('[2xJump]', pwX, 22);
  }

  // combo display
  if (comboCount > 1 && comboTimer > 0) {
    const scale = 1 + Math.sin(performance.now() * 0.01) * 0.05;
    ctx.font = `bold ${Math.floor(24 * scale)}px monospace`;
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffd700';
    ctx.globalAlpha = comboTimer / 60;
    ctx.fillText(comboCount + 'x COMBO', W / 2, 65);
    ctx.globalAlpha = 1;
  }

  // music visualizer — small EQ bars in bottom-left
  if (MusicEngine.isRunning()) {
    const it = MusicEngine.getIntensity();
    const bl = MusicEngine.getModernBlend();
    const t = performance.now() * 0.008;
    ctx.globalAlpha = 0.5;
    for (let i = 0; i < 8; i++) {
      const h = 5 + (Math.sin(t + i * 0.9) * 0.5 + 0.5) * 18 * (0.4 + it * 0.6);
      const hue = bl < 0.3 ? '#4ecca3' : (bl < 0.7 ? '#e9a045' : '#e94560');
      ctx.fillStyle = hue;
      ctx.fillRect(10 + i * 6, H - 6 - h, 4, h);
    }
    ctx.globalAlpha = 1;
    // mute hint
    ctx.font = '9px monospace';
    ctx.fillStyle = '#fff4';
    ctx.textAlign = 'left';
    ctx.fillText('[M] mute', 10, H - 2);
  }

  ctx.restore();
}

function draw() {
  const s = S();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // scale everything to fill the actual canvas
  ctx.setTransform(s, 0, 0, s, 0, 0);

  const shake = getShakeOffset();
  ctx.save();
  ctx.translate(shake.x, shake.y);

  drawBg();
  drawPlatforms();
  drawPowerups();
  drawCoins();
  drawEnemies();
  drawPlayer();
  drawParticles();
  drawFloatingTexts();

  ctx.restore();

  drawHUD();
}

  ];
